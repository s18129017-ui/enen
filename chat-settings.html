<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天设置</title>
    <style>
        :root {
            --app-bg: #f8f6f7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --dusty-pink: #d4a5b4;
            --dusty-pink-dark: #c08d9e;
            --dusty-pink-soft: #f4eaec;
            --text-dark: #3a3637;
            --text-gray: #a39ea0;
            --border-color: rgba(212, 165, 180, 0.18);
            --card-bg: #ffffff;
            --danger: #c67c8f;
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button,
        a,
        [role="button"],
        .save-btn,
        .danger-btn,
        .api-close,
        .api-btn,
        .preset-main {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        button,
        a,
        .preset-main {
            transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        button:active,
        a:active,
        [role="button"]:active,
        .preset-main:active {
            transform: translateY(1px) scale(0.97);
        }
        .save-btn,
        .danger-btn,
        .api-close,
        .api-btn,
        .preset-main {
            cursor: pointer;
        }
       /* 修改 body，让背景与页面主色一致，去掉居中对齐的约束 */
body {
    background-color: var(--app-bg);  /* 改为与页面背景相同的颜色 */
    display: block;                   /* 取消 flex 居中 */
    overflow: hidden;                /* 防止 body 滚动，滚动由内部处理 */
    margin: 0;
    padding: 0;
}

/* 将 .phone-screen 由手机框改为全屏容器 */
.phone-screen {
    width: 100vw;          /* 视口宽度 */
    height: 100vh;         /* 视口高度 */
    background-color: var(--app-bg);
    background-image: radial-gradient(circle at 0% 0%, #fff 0%, transparent 50%), radial-gradient(circle at 100% 100%, #f4eaec 0%, transparent 60%);
    position: relative;
    overflow: hidden;      /* 保持内部滚动，外部无滚动条 */
    border-radius: 0;      /* 去掉圆角 */
    box-shadow: none;      /* 去掉阴影 */
    /* 移除 inset 边框 */
    display: flex;
    flex-direction: column;
}

        .status-bar {
            display: none;
        }
        .status-right { display: flex; align-items: center; gap: 6px; }
        .css-battery { width: 22px; height: 11px; border: 1.5px solid var(--text-dark); border-radius: 4px; position: relative; padding: 1px; }
        .css-battery::before { content: ""; display: block; width: 70%; height: 100%; background: var(--text-dark); border-radius: 1px; }
        .css-battery::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: var(--text-dark); border-radius: 0 2px 2px 0; }
        .css-signal { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; }
        .css-signal span { width: 3px; background: var(--text-dark); border-radius: 2px; }
        .css-signal span:nth-child(1) { height: 4px; }
        .css-signal span:nth-child(2) { height: 6px; }
        .css-signal span:nth-child(3) { height: 8px; }
        .css-signal span:nth-child(4) { height: 10px; }

        .settings-header {
            padding: 6px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .back-link {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .i-back { width: 10px; height: 10px; border-left: 2px solid var(--text-dark); border-bottom: 2px solid var(--text-dark); transform: rotate(45deg); }
        .settings-title { font-size: 17px; color: var(--text-dark); font-weight: 700; }
        .save-btn {
            border: 1px solid rgba(212, 165, 180, 0.35);
            border-radius: 999px;
            background: var(--dusty-pink-soft);
            color: var(--dusty-pink-dark);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
            line-height: 1;
        }

        .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 24px;
            scrollbar-width: none;
        }
        .settings-body::-webkit-scrollbar { display: none; }

        .mode-input {
            display: none;
        }
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .mode-tab {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            color: var(--text-gray);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            padding: 9px 0;
        }
        #mode-simple:checked ~ .mode-tabs .tab-simple,
        #mode-detail:checked ~ .mode-tabs .tab-detail {
            color: var(--text-dark);
            background: var(--dusty-pink-soft);
            border-color: rgba(212, 165, 180, 0.35);
        }
        .mode-panel {
            display: none;
        }
        #mode-simple:checked ~ .mode-content .mode-simple-panel {
            display: block;
        }
        #mode-detail:checked ~ .mode-content .mode-detail-panel {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(212, 165, 180, 0.08);
        }

        .profile {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
        }
        .meta-title {
            color: var(--text-dark);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .meta-sub {
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.4;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field.full {
            grid-column: 1 / -1;
        }
        .field label {
            font-size: 11px;
            color: var(--text-gray);
        }
        .field input,
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            color: var(--text-dark);
            font-size: 13px;
            padding: 9px 10px;
            font-family: inherit;
        }
        .field textarea {
            min-height: 66px;
            resize: none;
            line-height: 1.45;
        }

        .range-row {
            display: grid;
            grid-template-columns: 1fr 28px 1fr;
            gap: 8px;
            align-items: end;
            margin-top: 10px;
        }
        .range-sep {
            text-align: center;
            color: var(--text-gray);
            font-size: 12px;
            padding-bottom: 10px;
        }
        .range-tip {
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.5;
        }

        .avatar-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .avatar-box {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: #fff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .avatar-preview {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .avatar-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .avatar-actions input[type="file"] {
            width: 100%;
            font-size: 11px;
        }

        .section-title {
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .bubble-section-note {
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .bubble-style-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .bubble-option.is-selected {
            border-color: rgba(212, 165, 180, 0.68);
            box-shadow: 0 8px 22px rgba(212, 165, 180, 0.16);
        }

        .bubble-option {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: linear-gradient(180deg, #fff, #fcf8f9);
            padding: 12px;
            box-shadow: 0 4px 14px rgba(212, 165, 180, 0.08);
        }

        .bubble-option-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .bubble-option-title {
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 700;
        }

        .bubble-option-tag {
            font-size: 10px;
            color: var(--text-gray);
            background: var(--dusty-pink-soft);
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .bubble-choice {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--dusty-pink-dark);
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .bubble-choice input {
            accent-color: var(--dusty-pink);
        }

        .bubble-option-preview {
            display: grid;
            gap: 8px;
            padding: 10px;
            border-radius: 14px;
            background: linear-gradient(180deg, #fff, #faf7f8);
            border: 1px solid rgba(212, 165, 180, 0.12);
        }

        .bubble-option-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .bubble-option-row.right {
            justify-content: flex-end;
        }

        .bubble-option-preview .bubble-left,
        .bubble-option-preview .bubble-right {
            width: auto;
            max-width: 76%;
            font-size: 11px;
            line-height: 1.42;
            box-shadow: 0 3px 10px rgba(58, 54, 55, 0.04);
        }

        .bubble-option-preview .bubble-left {
            min-width: 58%;
            padding: 8px 10px;
        }

        .bubble-option-preview .bubble-right {
            min-width: 50%;
            padding: 8px 10px;
        }

        .bubble-theme-bw .bubble-left,
        .bubble-theme-bw .bubble-right {
            border: 1px solid #111;
            box-shadow: none;
        }

        .bubble-theme-bw .bubble-left {
            background: #111;
            color: #fff;
            border-radius: 16px 16px 16px 5px;
        }

        .bubble-theme-bw .bubble-right {
            background: #fff;
            color: #111;
            border-radius: 16px 16px 5px 16px;
        }

        .bubble-theme-pink .bubble-left {
            background: #ffffff;
            color: #3a3637;
            border: 1px solid rgba(212, 165, 180, 0.26);
            border-radius: 18px 18px 18px 6px;
        }

        .bubble-theme-pink .bubble-right {
            background: linear-gradient(135deg, #d7a7b6, #c98fa1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 18px 18px 6px 18px;
        }

        .bubble-theme-wechat {
            background: linear-gradient(180deg, #f8fffb, #f3fbf6);
            border-color: rgba(147, 207, 147, 0.16);
        }

        .bubble-theme-wechat .bubble-left {
            background: #ffffff;
            color: #222;
            border: 1px solid #d7e5d7;
            border-radius: 14px 14px 14px 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .bubble-theme-wechat .bubble-right {
            background: #95ec69;
            color: #1b3a11;
            border: 1px solid #80d95f;
            border-radius: 14px 14px 4px 14px;
            box-shadow: 0 2px 8px rgba(149, 236, 105, 0.18);
        }

        .bubble-style-editor {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .bubble-style-editor label {
            font-size: 11px;
            color: var(--text-gray);
        }

        .bubble-style-editor textarea {
            width: 100%;
            min-height: 168px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: #fff;
            color: var(--text-dark);
            font-size: 12px;
            line-height: 1.55;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            resize: vertical;
        }

        .bubble-style-editor textarea::placeholder {
            color: #b9b3b5;
        }

        .bubble-custom-preview {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .bubble-custom-preview label {
            font-size: 11px;
            color: var(--text-gray);
        }

        .bubble-custom-preview-frame {
            width: 100%;
            height: 190px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: #fff;
            overflow: hidden;
        }

        .save-toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: rgba(58, 54, 55, 0.92);
            color: #fff;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 200;
        }
        .save-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        .danger-card {
            background: linear-gradient(145deg, #fff, #fbf3f5);
            border: 1px solid rgba(198,124,143,0.28);
        }
        .danger-title {
            color: var(--danger);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .danger-desc {
            color: var(--text-gray);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .danger-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: rgba(198,124,143,0.16);
            color: var(--danger);
            font-size: 13px;
            font-weight: 700;
            padding: 11px;
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <div class="status-bar">
            <div>21:16</div>
            <div class="status-right">
                <div class="css-signal"><span></span><span></span><span></span><span></span></div>
                <div class="css-battery"></div>
            </div>
        </div>

        <header class="settings-header">
            <a class="back-link" href="聊天界面.html" aria-label="返回聊天"><div class="i-back"></div></a>
            <div class="settings-title">聊天设置</div>
            <button class="save-btn" type="button" aria-label="保存">保存</button>
        </header>

        <main class="settings-body">
            <section class="card">
                <div class="section-title">聊天条数</div>
                <div class="meta-sub">直接填写每轮回复大概几条到几条。</div>
                <div class="range-row">
                    <div class="field">
                        <label>最少几条</label>
                        <input id="reply-count-min" type="number" min="1" max="20" inputmode="numeric" value="2" />
                    </div>
                    <div class="range-sep">到</div>
                    <div class="field">
                        <label>最多几条</label>
                        <input id="reply-count-max" type="number" min="1" max="20" inputmode="numeric" value="8" />
                    </div>
                </div>
                <div class="range-tip">保存后会作为聊天回复条数范围使用，比如 2 到 6 条。</div>
            </section>

            <section class="card">
                <div class="section-title">聊天对象人设</div>
                <div class="meta-sub" style="margin-bottom: 8px;">仅保留简约模式配置。</div>
                <div class="form-grid">
                    <div class="field">
                        <label>对象昵称</label>
                        <input id="simple-target-name" value="Winter" />
                    </div>
                    <div class="field">
                        <label>常用称呼</label>
                        <input id="simple-call-name" value="Miffy" />
                    </div>
                    <div class="field full">
                        <label>一句话人设</label>
                        <textarea id="simple-persona">温柔安静，偏爱灰粉色调，喜欢咖啡与摄影，聊天时语气自然柔和。</textarea>
                    </div>
                    <div class="field full">
                        <label>禁忌 / 避免话题</label>
                        <textarea id="simple-avoid">避免命令式语气，不讨论隐私敏感内容。</textarea>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="section-title">我的人设</div>
                <div class="form-grid">
                    <div class="field">
                        <label>我的昵称</label>
                        <input id="simple-self-name" value="Miffy" />
                    </div>
                    <div class="field">
                        <label>我的身份</label>
                        <input id="simple-self-tag" value="用户" />
                    </div>
                    <div class="field full">
                        <label>我的一句话人设</label>
                        <textarea id="simple-self-persona">喜欢记录日常和拍照，偏爱灰粉色系界面。</textarea>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="section-title">头像设置</div>
                <div class="meta-sub">支持上传本地图片，或直接填写图片 URL。</div>
                <div class="avatar-pair">
                    <div class="avatar-box">
                        <div class="meta-title" style="font-size:13px; margin-bottom:0;">聊天对象头像</div>
                        <div class="avatar-preview" id="simple-target-avatar-preview"></div>
                        <div class="avatar-actions">
                            <input id="simple-target-avatar-file" type="file" accept="image/*" />
                        </div>
                        <div class="field">
                            <label>对象头像 URL</label>
                            <input id="simple-target-avatar-url" placeholder="https://..." />
                        </div>
                    </div>

                    <div class="avatar-box">
                        <div class="meta-title" style="font-size:13px; margin-bottom:0;">我的头像</div>
                        <div class="avatar-preview" id="simple-self-avatar-preview" style="background: linear-gradient(135deg, #ffecd2, #fcb69f);"></div>
                        <div class="avatar-actions">
                            <input id="simple-self-avatar-file" type="file" accept="image/*" />
                        </div>
                        <div class="field">
                            <label>我的头像 URL</label>
                            <input id="simple-self-avatar-url" placeholder="https://..." />
                        </div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="section-title">气泡 CSS 样式</div>
                <div class="bubble-section-note">先选择一个内置气泡方案，或者直接在下面写自定义 CSS 覆盖样式。</div>
                <div class="bubble-style-grid">
                    <div class="bubble-option" data-bubble-preset="bw">
                        <div class="bubble-option-head">
                            <div class="bubble-option-title">黑白极简</div>
                            <label class="bubble-choice">
                                <input type="radio" name="bubblePreset" value="bw">
                                <span>使用</span>
                            </label>
                        </div>
                        <div class="bubble-option-preview bubble-theme-bw">
                            <div class="bubble-option-row">
                                <div class="bubble-left">黑底白字，适合强调发送态或者深色风格。</div>
                            </div>
                            <div class="bubble-option-row right">
                                <div class="bubble-right">白底黑字，适合接收态或者极简清爽风格。</div>
                            </div>
                        </div>
                    </div>

                    <div class="bubble-option" data-bubble-preset="pink">
                        <div class="bubble-option-head">
                            <div class="bubble-option-title">粉灰柔和</div>
                            <label class="bubble-choice">
                                <input type="radio" name="bubblePreset" value="pink">
                                <span>使用</span>
                            </label>
                        </div>
                        <div class="bubble-option-preview bubble-theme-pink">
                            <div class="bubble-option-row">
                                <div class="bubble-left">左侧气泡保持浅白和柔和灰边。</div>
                            </div>
                            <div class="bubble-option-row right">
                                <div class="bubble-right">右侧气泡用粉色渐变，整体更温柔。</div>
                            </div>
                        </div>
                    </div>

                    <div class="bubble-option" data-bubble-preset="wechat">
                        <div class="bubble-option-head">
                            <div class="bubble-option-title">微信清爽</div>
                            <label class="bubble-choice">
                                <input type="radio" name="bubblePreset" value="wechat">
                                <span>使用</span>
                            </label>
                        </div>
                        <div class="bubble-option-preview bubble-theme-wechat">
                            <div class="bubble-option-row">
                                <div class="bubble-left">左侧接收气泡，像微信那样清爽干净。</div>
                            </div>
                            <div class="bubble-option-row right">
                                <div class="bubble-right">右侧发送气泡，绿色高亮更接近微信风格。</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bubble-style-editor">
                    <label>自定义 CSS</label>
                    <textarea id="bubbleCustomCss" placeholder="/* 在这里写气泡样式，例如：\n.bubble {\n  border-radius: 20px;\n  background: linear-gradient(135deg, #f9edf0, #ffffff);\n}\n.outgoing .bubble {\n  background: #d4a5b4;\n  color: #fff;\n}\n*/"></textarea>
                </div>

                <div class="bubble-custom-preview">
                    <label>自定义 CSS 预览</label>
                    <iframe id="bubbleCustomPreviewFrame" class="bubble-custom-preview-frame" title="自定义 CSS 预览"></iframe>
                </div>
            </section>
        </main>
    </div>

    <div class="save-toast" id="saveToast">已保存</div>

    <script>
        (function() {
            var STORAGE_KEY = "miffy_chat_settings_v1";
            var REPLY_COUNT_KEY = "miffy_reply_count_v1";
            var saveButton = document.querySelector(".save-btn");
            var toast = document.getElementById("saveToast");
            var bubblePresetInputs = Array.prototype.slice.call(document.querySelectorAll('input[name="bubblePreset"]'));
            var bubbleCustomCss = document.getElementById("bubbleCustomCss");
            var bubbleCustomPreviewFrame = document.getElementById("bubbleCustomPreviewFrame");
            var bubbleOptions = Array.prototype.slice.call(document.querySelectorAll(".bubble-option"));

            var fields = {
                simple: {
                    targetName: document.getElementById("simple-target-name"),
                    callName: document.getElementById("simple-call-name"),
                    persona: document.getElementById("simple-persona"),
                    avoid: document.getElementById("simple-avoid"),
                    selfName: document.getElementById("simple-self-name"),
                    selfTag: document.getElementById("simple-self-tag"),
                    selfPersona: document.getElementById("simple-self-persona")
                },
                avatars: {
                    simpleTargetUrl: document.getElementById("simple-target-avatar-url"),
                    simpleSelfUrl: document.getElementById("simple-self-avatar-url"),
                    simpleTargetFile: document.getElementById("simple-target-avatar-file"),
                    simpleSelfFile: document.getElementById("simple-self-avatar-file"),
                    simpleTargetPreview: document.getElementById("simple-target-avatar-preview"),
                    simpleSelfPreview: document.getElementById("simple-self-avatar-preview")
                },
                replyCount: {
                    min: document.getElementById("reply-count-min"),
                    max: document.getElementById("reply-count-max")
                },
                bubbleStyle: {
                    presetInputs: bubblePresetInputs,
                    customCss: bubbleCustomCss
                }
            };

            var defaults = {
                simple: {
                    targetName: "Winter",
                    callName: "Miffy",
                    persona: "温柔安静，偏爱灰粉色调，喜欢咖啡与摄影，聊天时语气自然柔和。",
                    avoid: "避免命令式语气，不讨论隐私敏感内容。",
                    selfName: "Miffy",
                    selfTag: "用户",
                    selfPersona: "喜欢记录日常和拍照，偏爱灰粉色系界面。"
                },
                avatars: {
                    simple: {
                        targetUrl: "",
                        selfUrl: ""
                    }
                },
                bubbleStyle: {
                    preset: "pink",
                    customCss: ""
                }
            };

            function normalizeBubblePreset(value) {
                var preset = String(value || "").trim();
                if (preset === "bw" || preset === "pink" || preset === "wechat") {
                    return preset;
                }
                return "pink";
            }

            function syncBubblePresetSelection(preset) {
                var activePreset = normalizeBubblePreset(preset);
                bubblePresetInputs.forEach(function(input) {
                    input.checked = input.value === activePreset;
                });
                bubbleOptions.forEach(function(option) {
                    option.classList.toggle("is-selected", option.getAttribute("data-bubble-preset") === activePreset);
                });
                updateBubbleCustomPreview();
            }

            function getSelectedBubblePreset() {
                for (var i = 0; i < bubblePresetInputs.length; i += 1) {
                    if (bubblePresetInputs[i].checked) {
                        return bubblePresetInputs[i].value;
                    }
                }
                return defaults.bubbleStyle.preset;
            }

            function applyAvatarPreview(element, url, fallback) {
                if (!element) {
                    return;
                }
                if (url) {
                    element.style.backgroundImage = 'url("' + url.replace(/"/g, '\\"') + '")';
                    element.style.backgroundColor = "#fff";
                } else {
                    element.style.backgroundImage = "none";
                    element.style.background = fallback;
                }
            }

            function escapeStyleText(text) {
                return String(text || "").replace(/<\/style/gi, "<\\/style");
            }

            function buildBubblePreviewSrcdoc(preset, customCss) {
                var safePreset = normalizeBubblePreset(preset);
                var safeCss = escapeStyleText(customCss);

                return [
                    '<!doctype html>',
                    '<html>',
                    '<head>',
                    '<meta charset="utf-8">',
                    '<meta name="viewport" content="width=device-width,initial-scale=1">',
                    '<style>',
                    'html,body{margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}',
                    '.shell{min-height:100vh;box-sizing:border-box;padding:12px;background:linear-gradient(180deg,#fff,#faf7f8);display:flex;flex-direction:column;gap:8px;}',
                    '.row{display:flex;align-items:flex-end;gap:8px;}',
                    '.row.right{justify-content:flex-end;}',
                    '.bubble{width:auto;max-width:76%;font-size:11px;line-height:1.42;padding:8px 10px;box-shadow:0 3px 10px rgba(58,54,55,.04);}',
                    '.bubble.left{min-width:58%;}',
                    '.bubble.right{min-width:50%;}',
                    '.bubble-theme-bw .left,.bubble-theme-bw .right{border:1px solid #111;box-shadow:none;}',
                    '.bubble-theme-bw .left{background:#111;color:#fff;border-radius:16px 16px 16px 5px;}',
                    '.bubble-theme-bw .right{background:#fff;color:#111;border-radius:16px 16px 5px 16px;}',
                    '.bubble-theme-pink .left{background:#fff;color:#3a3637;border:1px solid rgba(212,165,180,.26);border-radius:18px 18px 18px 6px;}',
                    '.bubble-theme-pink .right{background:linear-gradient(135deg,#d7a7b6,#c98fa1);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:18px 18px 6px 18px;}',
                    '.bubble-theme-wechat{background:linear-gradient(180deg,#f8fffb,#f3fbf6);}',
                    '.bubble-theme-wechat .left{background:#fff;color:#222;border:1px solid #d7e5d7;border-radius:14px 14px 14px 4px;box-shadow:0 2px 8px rgba(0,0,0,.03);}',
                    '.bubble-theme-wechat .right{background:#95ec69;color:#1b3a11;border:1px solid #80d95f;border-radius:14px 14px 4px 14px;box-shadow:0 2px 8px rgba(149,236,105,.18);}',
                    safeCss,
                    '</' + 'style>',
                    '</' + 'head>',
                    '<' + 'body>',
                    '<div class="shell bubble-theme-' + safePreset + '">',
                    '<div class="row"><div class="bubble left">Left preview: custom CSS applies here in real time.</div></div>',
                    '<div class="row right"><div class="bubble right">Right preview: saved styles also apply in chat.</div></div>',
                    '</div>',
                    '</' + 'body>',
                    '</' + 'html>'
                ].join('');
            }

            function updateBubbleCustomPreview() {
                if (!bubbleCustomPreviewFrame) {
                    return;
                }
                bubbleCustomPreviewFrame.srcdoc = buildBubblePreviewSrcdoc(getSelectedBubblePreset(), bubbleCustomCss ? bubbleCustomCss.value : "");
            }

            function bindFilePicker(inputEl, targetInput, previewEl, fallback) {
                if (!inputEl || !targetInput) {
                    return;
                }
                inputEl.addEventListener("change", function() {
                    var file = inputEl.files && inputEl.files[0];
                    if (!file) {
                        return;
                    }
                    if (!file.type || file.type.indexOf("image/") !== 0) {
                        return;
                    }
                    var reader = new FileReader();
                    reader.onload = function() {
                        var result = reader.result || "";
                        targetInput.value = result;
                        applyAvatarPreview(previewEl, result, fallback);
                    };
                    reader.readAsDataURL(file);
                });
            }

            function loadSettings() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (error) {
                    console.warn("Failed to parse chat settings:", error);
                    return null;
                }
            }

            function saveSettings(settings) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
                notifySaved();
            }

            function saveBubbleStyleSettings(preset, customCss) {
                var currentSettings = loadSettings() || {};
                currentSettings.bubbleStyle = {
                    preset: normalizeBubblePreset(preset),
                    customCss: typeof customCss === "string" ? customCss : ""
                };
                saveSettings(currentSettings);
            }

            function clampReplyCount(value, fallback) {
                var num = parseInt(value, 10);
                if (!Number.isFinite(num)) {
                    return fallback;
                }
                return Math.max(1, Math.min(20, num));
            }

            function loadReplyCountRange() {
                var fallback = { min: 2, max: 8 };
                try {
                    var raw = localStorage.getItem(REPLY_COUNT_KEY);
                    if (!raw) {
                        return fallback;
                    }
                    var parsed = JSON.parse(raw);
                    var min = clampReplyCount(parsed.min, fallback.min);
                    var max = clampReplyCount(parsed.max, fallback.max);
                    if (max < min) {
                        max = min;
                    }
                    return { min: min, max: max };
                } catch (error) {
                    return fallback;
                }
            }

            function saveReplyCountRange(range) {
                localStorage.setItem(REPLY_COUNT_KEY, JSON.stringify(range));
            }

            function notifySaved() {
                var previousText = saveButton.textContent;
                saveButton.textContent = "已保存";
                toast.classList.add("show");
                window.clearTimeout(notifySaved._timer);
                notifySaved._timer = window.setTimeout(function() {
                    saveButton.textContent = previousText;
                    toast.classList.remove("show");
                }, 1200);
            }

            function applySettings(settings) {
                var data = settings || defaults;

                var simple = Object.assign({}, defaults.simple, data.simple || {});
                fields.simple.targetName.value = simple.targetName;
                fields.simple.callName.value = simple.callName;
                fields.simple.persona.value = simple.persona;
                fields.simple.avoid.value = simple.avoid;
                fields.simple.selfName.value = simple.selfName;
                fields.simple.selfTag.value = simple.selfTag;
                fields.simple.selfPersona.value = simple.selfPersona;

                var avatarsRaw = data.avatars || {};
                var legacyAvatars = (avatarsRaw.targetUrl || avatarsRaw.selfUrl)
                    ? { targetUrl: avatarsRaw.targetUrl || "", selfUrl: avatarsRaw.selfUrl || "" }
                    : {};
                var simpleAvatars = Object.assign({}, defaults.avatars.simple, legacyAvatars, avatarsRaw.simple || {});

                fields.avatars.simpleTargetUrl.value = simpleAvatars.targetUrl;
                fields.avatars.simpleSelfUrl.value = simpleAvatars.selfUrl;

                applyAvatarPreview(fields.avatars.simpleTargetPreview, simpleAvatars.targetUrl, "linear-gradient(135deg, #e0c3fc, #8ec5fc)");
                applyAvatarPreview(fields.avatars.simpleSelfPreview, simpleAvatars.selfUrl, "linear-gradient(135deg, #ffecd2, #fcb69f)");

                var bubbleStyle = Object.assign({}, defaults.bubbleStyle, data.bubbleStyle || {});
                var preset = normalizeBubblePreset(bubbleStyle.preset);
                if (fields.bubbleStyle.customCss) {
                    fields.bubbleStyle.customCss.value = bubbleStyle.customCss || "";
                }
                syncBubblePresetSelection(preset);
                updateBubbleCustomPreview();

                var replyRange = loadReplyCountRange();
                fields.replyCount.min.value = replyRange.min;
                fields.replyCount.max.value = replyRange.max;
            }

            function collectSettings() {
                return {
                    simple: {
                        targetName: fields.simple.targetName.value.trim(),
                        callName: fields.simple.callName.value.trim(),
                        persona: fields.simple.persona.value.trim(),
                        avoid: fields.simple.avoid.value.trim(),
                        selfName: fields.simple.selfName.value.trim(),
                        selfTag: fields.simple.selfTag.value.trim(),
                        selfPersona: fields.simple.selfPersona.value.trim()
                    },
                    avatars: {
                        simple: {
                            targetUrl: fields.avatars.simpleTargetUrl.value.trim(),
                            selfUrl: fields.avatars.simpleSelfUrl.value.trim()
                        }
                    },
                    bubbleStyle: {
                        preset: normalizeBubblePreset(getSelectedBubblePreset()),
                        customCss: fields.bubbleStyle.customCss ? fields.bubbleStyle.customCss.value : ""
                    }
                };
            }

            function updateChatPreview(settings) {
                var targetName = settings.simple.targetName;
                var subtitle = "简约模式 · " + (settings.simple.callName || "");

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
                } catch (error) {
                    console.warn("Failed to persist chat settings:", error);
                }

                if (targetName) {
                    localStorage.setItem(STORAGE_KEY + "_preview_name", targetName);
                }
                if (subtitle) {
                    localStorage.setItem(STORAGE_KEY + "_preview_subtitle", subtitle);
                }

                var activeAvatars = settings.avatars && settings.avatars.simple ? settings.avatars.simple : { targetUrl: "", selfUrl: "" };
                localStorage.setItem(STORAGE_KEY + "_avatar_target", activeAvatars.targetUrl || "");
                localStorage.setItem(STORAGE_KEY + "_avatar_self", activeAvatars.selfUrl || "");
            }

            applySettings(loadSettings());

            bubblePresetInputs.forEach(function(input) {
                input.addEventListener("change", function() {
                    syncBubblePresetSelection(input.value);
                    saveBubbleStyleSettings(input.value, bubbleCustomCss ? bubbleCustomCss.value : "");
                });
            });

            if (bubbleCustomCss) {
                bubbleCustomCss.addEventListener("input", updateBubbleCustomPreview);
            }

            fields.avatars.simpleTargetUrl.addEventListener("input", function() {
                applyAvatarPreview(fields.avatars.simpleTargetPreview, fields.avatars.simpleTargetUrl.value.trim(), "linear-gradient(135deg, #e0c3fc, #8ec5fc)");
            });
            fields.avatars.simpleSelfUrl.addEventListener("input", function() {
                applyAvatarPreview(fields.avatars.simpleSelfPreview, fields.avatars.simpleSelfUrl.value.trim(), "linear-gradient(135deg, #ffecd2, #fcb69f)");
            });
            bindFilePicker(fields.avatars.simpleTargetFile, fields.avatars.simpleTargetUrl, fields.avatars.simpleTargetPreview, "linear-gradient(135deg, #e0c3fc, #8ec5fc)");
            bindFilePicker(fields.avatars.simpleSelfFile, fields.avatars.simpleSelfUrl, fields.avatars.simpleSelfPreview, "linear-gradient(135deg, #ffecd2, #fcb69f)");

            saveButton.addEventListener("click", function() {
                var settings = collectSettings();
                var replyMin = clampReplyCount(fields.replyCount.min.value, 2);
                var replyMax = clampReplyCount(fields.replyCount.max.value, 8);
                if (replyMax < replyMin) {
                    replyMax = replyMin;
                }

                fields.replyCount.min.value = replyMin;
                fields.replyCount.max.value = replyMax;

                saveSettings(settings);
                saveReplyCountRange({ min: replyMin, max: replyMax });
                updateChatPreview(settings);
            });
        })();
    </script>
</body>
</html>
