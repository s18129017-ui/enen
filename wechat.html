<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Miffy Social App</title>
    <style>
        :root {
            --app-bg: #f8f6f7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --dusty-pink: #d4a5b4;
            --dusty-pink-light: #f4eaec;
            --text-dark: #3a3637;
            --text-gray: #a39ea0;
            --border-color: rgba(212, 165, 180, 0.18);
            --card-bg: #ffffff;
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --nav-height: 74px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        button,
        a,
        [role="button"],
        .nav-label,
        .top-left-hit,
        .entry-link,
        .chat-item,
        .c-item,
        .story-item {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        button,
        a,
        [role="button"],
        .nav-label,
        .top-left-hit,
        .entry-link,
        .chat-item,
        .c-item,
        .story-item {
            transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        button:active,
        a:active,
        [role="button"]:active,
        .nav-label:active,
        .top-left-hit:active,
        .entry-link:active,
        .chat-item:active,
        .c-item:active,
        .story-item:active {
            transform: translateY(1px) scale(0.97);
        }
        html, body { height: 100%; }
        body { background-color: #e2dfdb; font-family: var(--font-family); margin: 0; min-height: 100vh; overflow: hidden; overscroll-behavior: none; opacity: 0; transform: translate3d(0, 10px, 0); transition: opacity 0.22s ease, transform 0.22s ease; }
        body.page-ready { opacity: 1; transform: translate3d(0, 0, 0); }
        body.page-leaving { opacity: 0; transform: translate3d(0, 8px, 0); }
        .phone-screen {
            width: 100vw;
            height: 100svh;
            height: 100dvh;
            background-color: var(--app-bg);
            background-image: radial-gradient(circle at 0% 0%, #fff 0%, transparent 50%), radial-gradient(circle at 100% 100%, var(--dusty-pink-light) 0%, transparent 60%);
            position: relative;
            overflow: hidden;
            border-radius: 0;
            box-shadow: none;
            display: flex; flex-direction: column;
            min-height: 0;
        }
        .top-left-hit {
            position: absolute;
            top: 0;
            left: 0;
            width: 32px;
            height: 32px;
            z-index: 160;
            text-decoration: none;
            background: transparent;
        }
        .status-bar { display: none; }
        .status-right { display: flex; align-items: center; gap: 6px; }
        .css-battery { width: 22px; height: 11px; border: 1.5px solid var(--text-dark); border-radius: 4px; position: relative; padding: 1px; }
        .css-battery::before { content: ''; display: block; width: 70%; height: 100%; background: var(--text-dark); border-radius: 1px; }
        .css-battery::after { content: ''; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: var(--text-dark); border-radius: 0 2px 2px 0; }
        .css-signal { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; }
        .css-signal span { width: 3px; background: var(--text-dark); border-radius: 2px;}
        .css-signal span:nth-child(1) { height: 4px; } .css-signal span:nth-child(2) { height: 6px; } .css-signal span:nth-child(3) { height: 8px; } .css-signal span:nth-child(4) { height: 10px; }
        input[type="radio"] { display: none; }
        .page { display: none; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scrollbar-width: none; padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 12px); }
        .page::-webkit-scrollbar { display: none; }
        #tab-1:checked ~ .pages #page-1,
        #tab-2:checked ~ .pages #page-2,
        #tab-3:checked ~ .pages #page-3,
        #tab-4:checked ~ .pages #page-4 { display: block; animation: fadeIn 0.18s ease; }
        @keyframes fadeIn { from { opacity: 0.65; } to { opacity: 1; } }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(var(--nav-height) + max(var(--safe-bottom), 8px));
            background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--border-color); border-radius: 0;
            display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; padding-bottom: max(10px, var(--safe-bottom)); z-index: 200;
        }
        .nav-label { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px; cursor: pointer; }
        .nav-text { font-size: 10px; color: var(--text-gray); font-weight: 500; transition: color 0.3s; }
        .nav-icon { width: 24px; height: 24px; position: relative; opacity: 0.4; transition: all 0.3s; }
        .icon-msg { border: 2px solid var(--text-dark); border-radius: 12px 12px 12px 4px; }
        .icon-contact::before { content:''; position:absolute; bottom: 2px; left: 2px; width: 20px; height: 10px; border: 2px solid var(--text-dark); border-bottom: none; border-radius: 10px 10px 0 0; }
        .icon-contact::after { content:''; position:absolute; top: 2px; left: 7px; width: 10px; height: 10px; border: 2px solid var(--text-dark); border-radius: 50%; }
        .icon-star { border: 2px solid var(--text-dark); border-radius: 8px; transform: rotate(45deg); }
        .icon-star::after { content:''; position:absolute; top: 4px; left: 4px; width: 12px; height: 12px; border: 2px solid var(--text-dark); border-radius: 50%; }
        .icon-me::before { content:''; position:absolute; bottom: 2px; left: 4px; width: 16px; height: 8px; border: 2px solid var(--text-dark); border-bottom: none; border-radius: 8px 8px 0 0; }
        .icon-me::after { content:''; position:absolute; top: 3px; left: 7px; width: 10px; height: 10px; border: 2px solid var(--text-dark); border-radius: 50%; }
        #tab-1:checked ~ .bottom-nav .lbl-1 .nav-text,
        #tab-2:checked ~ .bottom-nav .lbl-2 .nav-text,
        #tab-3:checked ~ .bottom-nav .lbl-3 .nav-text,
        #tab-4:checked ~ .bottom-nav .lbl-4 .nav-text { color: var(--dusty-pink); font-weight: 600;}
        #tab-1:checked ~ .bottom-nav .lbl-1 .nav-icon,
        #tab-2:checked ~ .bottom-nav .lbl-2 .nav-icon,
        #tab-3:checked ~ .bottom-nav .lbl-3 .nav-icon,
        #tab-4:checked ~ .bottom-nav .lbl-4 .nav-icon { opacity: 1; transform: translateY(-2px); }
        #tab-1:checked ~ .bottom-nav .lbl-1 .icon-msg { border-color: var(--dusty-pink); background: var(--dusty-pink-light); }
        #tab-2:checked ~ .bottom-nav .lbl-2 .icon-contact::before, #tab-2:checked ~ .bottom-nav .lbl-2 .icon-contact::after { border-color: var(--dusty-pink); }
        #tab-3:checked ~ .bottom-nav .lbl-3 .icon-star, #tab-3:checked ~ .bottom-nav .lbl-3 .icon-star::after { border-color: var(--dusty-pink); }
        #tab-4:checked ~ .bottom-nav .lbl-4 .icon-me::before, #tab-4:checked ~ .bottom-nav .lbl-4 .icon-me::after { border-color: var(--dusty-pink); }
        .app-header { padding: calc(8px + var(--safe-top)) max(16px, calc(16px + var(--safe-right))) 10px max(16px, calc(16px + var(--safe-left))); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; background: var(--app-bg); }
        .app-header.glass { background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); }
        .header-title { font-size: 20px; font-weight: 700; color: var(--text-dark); }
        .header-actions { display: flex; gap: 16px; align-items: center; }
        .avatar { border-radius: 14px; background: #e0e0e0; position: relative; overflow: hidden; flex-shrink: 0;}
        .av-1 { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
        .av-2 { background: linear-gradient(135deg, #fdfbfb, #ebedee); }
        .av-3 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .av-4 { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
        .av-5 { background: linear-gradient(to top, #cfd9df, #e2ebf0); }
        .divider { height: 1px; background: var(--border-color); margin-left: 70px; margin-right: max(0px, var(--safe-right)); }
        .i-search { width: 18px; height: 18px; border: 2px solid var(--text-dark); border-radius: 50%; position: relative; }
        .i-search::after { content:''; position:absolute; bottom: -4px; right: -4px; width: 6px; height: 2px; background: var(--text-dark); transform: rotate(45deg); border-radius: 2px; }
        .i-plus { width: 20px; height: 20px; position: relative; }
        .i-plus::before, .i-plus::after { content:''; position:absolute; background: var(--text-dark); border-radius: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .i-plus::before { width: 14px; height: 2px; } .i-plus::after { width: 2px; height: 14px; }
        .i-camera { width: 22px; height: 16px; border: 2px solid var(--text-dark); border-radius: 4px; position: relative; }
        .i-camera::before { content:''; position:absolute; top:-3px; left:4px; width: 10px; height: 3px; background: var(--text-dark); border-radius: 2px 2px 0 0;}
        .i-camera::after { content:''; position:absolute; top: 2px; left: 4px; width: 8px; height: 8px; border: 2px solid var(--text-dark); border-radius: 50%; }
        .i-arrow { width: 8px; height: 8px; border-top: 2px solid var(--text-gray); border-right: 2px solid var(--text-gray); transform: rotate(45deg); opacity: 0.6;}
        .story-scroll { display: flex; gap: 14px; padding: 10px max(16px, calc(16px + var(--safe-right))) 10px max(16px, calc(16px + var(--safe-left))); overflow-x: auto; }
        .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .story-ring { width: 56px; height: 56px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, var(--dusty-pink), #e8c5d1); }
        .story-ring .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--app-bg); }
        .story-item.my .story-ring { background: var(--border-color); }
        .chat-item { display: flex; align-items: center; padding: 12px max(16px, calc(16px + var(--safe-right))) 12px max(16px, calc(16px + var(--safe-left))); }
        .entry-link { text-decoration: none; color: inherit; display: block; }
        .chat-avatar-box { position: relative; margin-right: 14px; }
        .chat-avatar-box .avatar { width: 50px; height: 50px; }
        .status-dot { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; background: #a8d5a2; border: 2px solid var(--app-bg); border-radius: 50%; }
        .status-dot.pink { background: var(--dusty-pink); }
        .chat-content { flex: 1; min-width: 0; }
        .c-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .c-name { font-size: 16px; font-weight: 500; color: var(--text-dark); }
        .c-time { font-size: 11px; color: var(--text-gray); }
        .c-msg { font-size: 13px; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        .badge { background: var(--dusty-pink); color: #fff; font-size: 10px; font-weight: bold; min-width: 18px; height: 18px; border-radius: 9px; display: flex; justify-content: center; align-items: center; padding: 0 5px; }
        .contact-group { padding: 10px 0; }
        .c-item { display: flex; align-items: center; padding: 10px max(16px, calc(16px + var(--safe-right))) 10px max(16px, calc(16px + var(--safe-left))); }
        .c-item .avatar { width: 40px; height: 40px; border-radius: 12px; margin-right: 15px; display: flex; justify-content: center; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); }
        .icon-new-friend { width: 18px; height: 18px; border: 2px solid var(--dusty-pink); border-radius: 50%; position: relative; }
        .icon-new-friend::after { content:'+'; position:absolute; top:-8px; right:-8px; color: var(--dusty-pink); font-size: 14px; font-weight: bold;}
        .icon-group { width: 14px; height: 14px; border: 2px solid #8ba4c7; border-radius: 50%; position: relative; transform: translateX(-4px);}
        .icon-group::after { content:''; position:absolute; top: -2px; left: 8px; width: 10px; height: 10px; border: 2px solid #8ba4c7; border-radius: 50%; }
        .c-name-text { font-size: 15px; color: var(--text-dark); }
        .index-letter { background: var(--dusty-pink-light); color: var(--dusty-pink); font-size: 12px; font-weight: bold; padding: 4px max(16px, calc(16px + var(--safe-right))) 4px max(16px, calc(16px + var(--safe-left))); margin-top: 10px;}
        .alpha-nav { position: fixed; right: max(6px, calc(6px + var(--safe-right))); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--text-gray); z-index: 60; pointer-events: none;}
        .moments-header { height: 220px; background: linear-gradient(180deg, #e4d5dc 0%, var(--app-bg) 100%); position: relative; margin-bottom: 40px;}
        .moments-user { position: absolute; right: 20px; bottom: -20px; display: flex; align-items: center; gap: 15px; }
        .moments-user .name { font-size: 18px; font-weight: bold; color: var(--text-dark); text-shadow: 0 1px 2px rgba(255,255,255,0.5); margin-bottom: 25px;}
        .moments-user .avatar { width: 64px; height: 64px; border-radius: 18px; border: 3px solid var(--app-bg); }
        .moment-card { padding: 20px max(16px, calc(16px + var(--safe-right))) 20px max(16px, calc(16px + var(--safe-left))); display: flex; gap: 12px; border-bottom: 1px solid var(--border-color); }
        .moment-card .avatar { width: 42px; height: 42px; }
        .m-content { flex: 1; }
        .m-name { font-size: 15px; font-weight: 600; color: #826e75; margin-bottom: 4px; }
        .m-text { font-size: 14px; color: var(--text-dark); line-height: 1.5; margin-bottom: 10px; }
        .m-grid { display: grid; grid-template-columns: repeat(2, 100px); gap: 6px; margin-bottom: 12px; }
        .m-img { width: 100px; height: 100px; border-radius: 8px; background: #e0e0e0; }
        .m-img-1 { background: linear-gradient(45deg, #d4a5b4, #e8c5d1); }
        .m-img-2 { background: linear-gradient(45deg, #cfd9df, #e2ebf0); }
        .m-footer { display: flex; justify-content: space-between; align-items: center; }
        .m-time { font-size: 11px; color: var(--text-gray); }
        .m-actions { display: flex; gap: 16px; background: var(--card-bg); padding: 4px 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);}
        .i-heart { width: 14px; height: 14px; position: relative; transform: rotate(-45deg) translateY(2px); }
        .i-heart::before, .i-heart::after { content:''; position:absolute; width: 14px; height: 14px; background: var(--text-gray); border-radius: 50%; }
        .i-heart::before { top: -7px; left: 0; } .i-heart::after { top: 0; left: 7px; }
        .i-heart.active::before, .i-heart.active::after { background: var(--dusty-pink); }
        .i-chat { width: 16px; height: 12px; border: 1.5px solid var(--text-gray); border-radius: 4px; position: relative; margin-top: 2px;}
        .i-chat::after { content:''; position:absolute; bottom:-4px; left: 3px; border-width: 3px; border-style: solid; border-color: var(--text-gray) transparent transparent transparent; transform: rotate(20deg); }
        /* Me page styles imported from nav-me.css */
        .i-qr { width: 16px; height: 16px; border: 1px solid var(--text-gray); display: grid; grid-template-columns: 1fr 1fr; gap: 1px; padding: 2px; border-radius: 3px; opacity: 0.6;}
        .i-qr span { background: var(--text-gray); border-radius: 1px;}
        .i-qr span:nth-child(4) { background: transparent; }
        .setting-group { margin: 0 max(16px, calc(16px + var(--safe-right))) 20px max(16px, calc(16px + var(--safe-left))); background: var(--card-bg); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .s-item { display: flex; align-items: center; padding: 16px 20px; position: relative; }
        .s-item:not(:last-child)::after { content:''; position:absolute; bottom: 0; left: 54px; right: 0; height: 1px; background: var(--border-color); }
        .s-icon-box { width: 26px; height: 26px; border-radius: 8px; margin-right: 12px; display: flex; justify-content: center; align-items: center; }
        .bg-pink { background: linear-gradient(135deg, #f0e4e8, var(--dusty-pink)); }
        .bg-blue { background: linear-gradient(135deg, #e0ebf5, #a3c2db); }
        .bg-yellow { background: linear-gradient(135deg, #fdf5e6, #ebd5a3); }
        .bg-gray { background: linear-gradient(135deg, #f0f0f0, #c4c4c4); }
        .i-wallet { width: 14px; height: 10px; border: 1.5px solid #fff; border-radius: 2px; }
        .i-fav { width: 12px; height: 12px; background: #fff; transform: rotate(45deg); border-radius: 2px;}
        .i-album { width: 14px; height: 10px; border: 1.5px solid #fff; border-radius: 2px; position: relative;}
        .i-album::after { content:''; position:absolute; bottom:0; left:2px; width:6px; height:4px; background:#fff; clip-path: polygon(50% 0, 100% 100%, 0 100%);}
        .i-card { width: 14px; height: 10px; border-top: 3px solid #fff; border-bottom: 3px solid #fff; }
        .i-gear { width: 12px; height: 12px; border: 2px dashed #fff; border-radius: 50%; }
        .s-text { flex: 1; font-size: 15px; color: var(--text-dark); }

        @media (max-width: 380px) {
            .header-title { font-size: 18px; }
            .nav-label { width: 56px; }
            .nav-text { font-size: 9px; }
            .story-ring { width: 52px; height: 52px; }
            .chat-avatar-box .avatar { width: 46px; height: 46px; }
            .c-name { font-size: 15px; }
            .c-msg { font-size: 12px; }
            .moment-card { gap: 10px; }
            .m-grid { grid-template-columns: repeat(2, minmax(80px, 96px)); }
            .m-img { width: 100%; height: 96px; }
        }

        @media (prefers-reduced-motion: reduce) {
            body { opacity: 1; transform: none; transition: none; }
            body.page-ready, body.page-leaving { opacity: 1; transform: none; }
            button,
            a,
            [role="button"],
            .nav-label,
            .top-left-hit,
            .entry-link,
            .chat-item,
            .c-item,
            .story-item,
            .nav-text,
            .nav-icon { transition: none; }
            #tab-1:checked ~ .pages #page-1,
            #tab-2:checked ~ .pages #page-2,
            #tab-3:checked ~ .pages #page-3,
            #tab-4:checked ~ .pages #page-4 { animation: none; }
        }
    </style>
</head>
<body>
    <div class="phone-screen">
        <a class="top-left-hit" href="index.html" aria-label="返回桌面"></a>
        <div class="status-bar">
            <div>21:16</div>
            <div class="status-right">
                <div class="css-signal"><span></span><span></span><span></span><span></span></div>
                <div class="css-battery"></div>
            </div>
        </div>

        <input type="radio" name="nav" id="tab-1" checked>
        <input type="radio" name="nav" id="tab-2">
        <input type="radio" name="nav" id="tab-3">
        <input type="radio" name="nav" id="tab-4">

        <div class="pages" style="display:flex; flex:1; flex-direction:column; overflow:hidden; min-height:0;">
            <div id="page-1" class="page">
                <header class="app-header glass">
                    <div class="header-title">Messages</div>
                    <div class="header-actions"><div class="i-search"></div><div class="i-plus"></div></div>
                </header>
                <div class="story-scroll">
                    <div class="story-item my"><div class="story-ring"><div class="avatar"></div></div></div>
                    <div class="story-item"><div class="story-ring"><div class="avatar av-1"></div></div><span style="font-size:10px;color:var(--text-gray)">Winter</span></div>
                    <div class="story-item"><div class="story-ring"><div class="avatar av-2"></div></div><span style="font-size:10px;color:var(--text-gray)">Nako</span></div>
                    <div class="story-item"><div class="story-ring"><div class="avatar av-3"></div></div><span style="font-size:10px;color:var(--text-gray)">Isla</span></div>
                    <div class="story-item"><div class="story-ring"><div class="avatar av-4"></div></div><span style="font-size:10px;color:var(--text-gray)">Rin</span></div>
                </div>
                <div id="messageList"></div>
            </div>
            <div id="page-2" class="page">
                <header class="app-header glass">
                    <div class="header-title">Contacts</div>
                    <div class="header-actions"><div class="i-search"></div></div>
                </header>
                <div class="alpha-nav"><span>↑</span><span>A</span><span>B</span><span>C</span><span>F</span><span>I</span><span>M</span><span>N</span><span>R</span><span>W</span><span>#</span></div>
                <div class="contact-group">
                    <div class="c-item"><div class="avatar"><div class="icon-new-friend"></div></div><span class="c-name-text">New Friends</span></div>
                    <div class="c-item"><div class="avatar"><div class="icon-group"></div></div><span class="c-name-text">Group Chats</span></div>
                </div>
                <div id="dynamicContacts"></div>
            </div>
            <div id="page-3" class="page">
                <header class="app-header" style="position:absolute; width:100%; background:transparent;">
                    <div class="header-title" style="visibility:hidden">Moments</div>
                    <div class="header-actions" style="margin-right:10px;"><div class="i-camera"></div></div>
                </header>
                <div class="moments-header">
                    <div class="moments-user">
                        <span class="name">Miffy</span>
                        <div class="avatar av-4"></div>
                    </div>
                </div>
                <div class="moment-card">
                    <div class="avatar av-1"></div>
                    <div class="m-content">
                        <div class="m-name">Winter</div>
                        <div class="m-text">粉色黄昏与不期而遇的温柔。☁️</div>
                        <div class="m-grid">
                            <div class="m-img m-img-1"></div>
                            <div class="m-img m-img-2"></div>

    <!-- Add Contact Modal -->
    <div id="addContactModal" class="modal" aria-hidden="true" style="display:none;">
        <div class="modal-sheet">
            <div class="modal-title">添加</div>
            <div style="padding:12px 16px; display:flex; flex-direction:column; gap:8px;">
                <button id="btnSelfBuild" class="modal-btn">自建联系人</button>
                <button id="btnImportCard" class="modal-btn">导入角色卡</button>
            </div>
        </div>
    </div>

    <!-- Self build contact modal -->
    <div id="selfBuildModal" class="modal" aria-hidden="true" style="display:none;">
        <div class="modal-sheet">
    
            <div class="modal-title">新建联系人</div>
            <div style="padding:12px 16px; display:flex; flex-direction:column; gap:8px;">
                <input id="contactName" placeholder="昵称" style="padding:10px;border-radius:10px;border:1px solid var(--border-color);">
                <input id="contactCallName" placeholder="称呼" style="padding:10px;border-radius:10px;border:1px solid var(--border-color);">
                <input id="contactAvatarUrl" placeholder="头像 URL (可选)" style="padding:10px;border-radius:10px;border:1px solid var(--border-color);">
            </div>
            <div style="display:flex; gap:10px; padding:12px 16px; justify-content:flex-end;">
                <button id="selfBuildCancel" class="modal-action">取消</button>
                <button id="selfBuildSave" class="modal-action primary">保存</button>
            </div>
        </div>

    <link rel="stylesheet" href="nav-me.css">
    <style>
        .modal { position: fixed; left: 0; top: 0; right:0; bottom:0; background: rgba(0,0,0,0.25); display:flex; align-items:flex-end; justify-content:center; z-index:300; }
        .modal-sheet { width: 100%; max-width: 520px; background: #fff; border-radius: 14px 14px 0 0; box-shadow: 0 -6px 30px rgba(0,0,0,0.12); padding-bottom:12px; }
        .modal.show { display:flex !important; }
        .modal-close { position:absolute; right:12px; top:8px; border:none; background:transparent; font-size:20px; }
        .modal-title { font-size:16px; font-weight:700; padding:14px 16px 6px 16px; }
        .modal-btn { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--card-bg); font-weight:600; }
        .modal-action { padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:transparent; }
        .modal-action.primary { background: var(--dusty-pink); color:#fff; border: none; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
            var CONTACTS_KEY = 'miffy_contacts_v1';
            var CHATS_KEY = 'miffy_chats_v1';
            var CHAT_HISTORY_KEY = 'miffy_chat_history_v1';
            var plus = document.querySelector('.i-plus');
            var addModal = document.getElementById('addContactModal');
            var btnSelf = document.getElementById('btnSelfBuild');
            var btnImport = document.getElementById('btnImportCard');
            var selfModal = document.getElementById('selfBuildModal');
            var selfClose = document.getElementById('selfBuildClose');
            var selfCancel = document.getElementById('selfBuildCancel');
            var selfSave = document.getElementById('selfBuildSave');

            function openModal(m){ if(!m) return; m.style.display='flex'; m.classList.add('show'); m.setAttribute('aria-hidden','false'); }
            function closeModal(m){ if(!m) return; m.style.display='none'; m.classList.remove('show'); m.setAttribute('aria-hidden','true'); }

            if(plus) plus.addEventListener('click', function(e){ e.preventDefault(); openModal(addModal); });
            if(addModal) addModal.addEventListener('click', function(e){ if(e.target === addModal) closeModal(addModal); });

            if(btnSelf) btnSelf.addEventListener('click', function(){ closeModal(addModal); openModal(selfModal); });
            if(btnImport) btnImport.addEventListener('click', function(){ closeModal(addModal); alert('导入角色卡功能尚未实现'); });

            if(selfClose) selfClose.addEventListener('click', function(){ closeModal(selfModal); });
            if(selfCancel) selfCancel.addEventListener('click', function(){ closeModal(selfModal); });
            if(selfModal) selfModal.addEventListener('click', function(e){ if(e.target === selfModal) closeModal(selfModal); });

            function readContacts(){ try{ return JSON.parse(localStorage.getItem(CONTACTS_KEY)||'[]'); }catch(e){ return []; } }
            function writeContacts(list){ try{ localStorage.setItem(CONTACTS_KEY, JSON.stringify(list||[])); }catch(e){}
            }
            function readChats(){ try{ return JSON.parse(localStorage.getItem(CHATS_KEY)||'[]'); }catch(e){ return []; } }
            function writeChats(list){ try{ localStorage.setItem(CHATS_KEY, JSON.stringify(list||[])); }catch(e){}
            }
            function readChatHistory(){ try{ var raw = JSON.parse(localStorage.getItem('miffy_chat_history_v1')||'{}'); return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}; }catch(e){ return {}; } }
            function writeChatHistory(map){ try{ localStorage.setItem('miffy_chat_history_v1', JSON.stringify(map||{})); }catch(e){}
            }
            function readChatSettingsMap(){ try{ var raw = JSON.parse(localStorage.getItem('miffy_chat_settings_by_chat_v1')||'{}'); return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}; }catch(e){ return {}; } }
            function writeChatSettingsMap(map){ try{ localStorage.setItem('miffy_chat_settings_by_chat_v1', JSON.stringify(map||{})); }catch(e){}
            }
            function buildTimeText(){ var now = new Date(); return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'); }
            function createContactId(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
            function createChatId(contactId){ return 'chat_' + contactId; }
            function buildChatRoute(item){
                var params = new URLSearchParams();
                if(item && item.id) params.set('chatId', item.id);
                if(item && item.contactId) params.set('contactId', item.contactId);
                var query = params.toString();
                return '聊天界面.html' + (query ? '?' + query : '');
            }
            function readChatHistories(){
                try{
                    var raw = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || '{}');
                    if(raw && typeof raw === 'object' && !Array.isArray(raw)) return raw;
                    return {};
                }catch(e){ return {}; }
            }
            function writeChatHistories(map){
                try{ localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(map || {})); }catch(e){}
            }
            function createId(prefix){
                return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            }
            function formatCurrentTime(){
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                return hh + ':' + mm;
            }
            function buildChatDetailHref(chat){
                var params = new URLSearchParams();
                if(chat && chat.id) params.set('chatId', chat.id);
                if(chat && chat.contactId) params.set('contactId', chat.contactId);
                return '聊天界面.html?' + params.toString();
            }
            function extractAvatarText(name){
                var text = String(name || '').trim();
                return text ? text.charAt(0).toUpperCase() : 'W';
            }
            function buildAvatarGradient(seedText){
                var seed = (seedText || 'W').charCodeAt(0) || 87;
                var hueA = seed % 360;
                var hueB = (seed * 2 + 47) % 360;
                return 'linear-gradient(135deg, hsl(' + hueA + ', 78%, 82%), hsl(' + hueB + ', 72%, 68%))';
            }
            function applyAvatarFallback(el, name, avatarUrl){
                if(!el) return;
                var avatarText = extractAvatarText(name);
                if(avatarUrl){
                    el.style.background = '';
                    el.style.backgroundImage = 'url("' + avatarUrl.replace(/"/g, '\\"') + '")';
                    el.style.backgroundSize = 'cover';
                    el.style.backgroundPosition = 'center';
                    el.style.color = 'transparent';
                    el.textContent = '';
                    return;
                }
                el.style.backgroundImage = 'none';
                el.style.background = buildAvatarGradient(avatarText);
                el.style.backgroundSize = '';
                el.style.backgroundPosition = '';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.color = '#ffffff';
                el.style.fontWeight = '700';
                el.textContent = avatarText;
            }
            function renderContacts(){
                var dyn = document.getElementById('dynamicContacts');
                if(!dyn) return;
                var list = readContacts().slice().sort(function(a, b){
                    var nameA = String((a && (a.name || a.callName)) || '').toLowerCase();
                    var nameB = String((b && (b.name || b.callName)) || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });
                dyn.innerHTML = '';
                var lastLetter = '';
                for(var i=0;i<list.length;i++){
                    var c = list[i];
                    var displayName = c.name || c.callName || 'Unnamed';
                    var firstLetter = displayName.charAt(0).toUpperCase() || '#';
                    if(firstLetter !== lastLetter){
                        var indexLetter = document.createElement('div');
                        indexLetter.className = 'index-letter';
                        indexLetter.textContent = /[A-Z]/.test(firstLetter) ? firstLetter : '#';
                        dyn.appendChild(indexLetter);
                        lastLetter = firstLetter;
                    }
                    var a = document.createElement('a'); a.className='entry-link';
                    a.href = buildChatDetailHref({ id: c.chatId, contactId: c.id, name: c.name, callName: c.callName, avatar: c.avatar });
                    var row = document.createElement('div'); row.className='c-item';
                    var av = document.createElement('div'); av.className='avatar'; av.style.width='40px'; av.style.height='40px'; applyAvatarFallback(av, displayName, c.avatar);
                    var span = document.createElement('span'); span.className='c-name-text'; span.textContent = displayName;
                    row.appendChild(av); row.appendChild(span); a.appendChild(row); dyn.appendChild(a);
                    if(i < list.length - 1){
                        var divider = document.createElement('div');
                        divider.className = 'divider';
                        divider.style.marginLeft = '75px';
                        dyn.appendChild(divider);
                    }
                }
            }
            function renderSavedChats(){
                var messageList = document.getElementById('messageList');
                if(!messageList) return;
                var chats = readChats();
                messageList.innerHTML = '';

                for(var j=0;j<chats.length;j++){
                    var item = chats[j];
                    var displayName = item.name || item.callName || 'Unnamed';
                    var link = document.createElement('a');
                    link.className = 'entry-link';
                    link.href = buildChatDetailHref(item);

                    var chat = document.createElement('div');
                    chat.className = 'chat-item';

                    var avatarBox = document.createElement('div');

                    var row1 = document.createElement('div');
                    avatarBox.className = 'chat-avatar-box';
                    var av = document.createElement('div');
                    av.className = 'avatar';
                    av.style.width = '50px';
                    av.style.height = '50px';
                    applyAvatarFallback(av, displayName, item.avatar);
                    avatarBox.appendChild(av);

                    var content = document.createElement('div');
                    content.className = 'chat-content';

                    row1.className = 'c-row';
                    var name = document.createElement('span');
                    name.className = 'c-name';
                    name.textContent = displayName;
                    var time = document.createElement('span');
                    time.className = 'c-time';
                    time.textContent = item.time || 'Now';
                    row1.appendChild(name);
                    row1.appendChild(time);

                    var row2 = document.createElement('div');
                    row2.className = 'c-row';
                    var msg = document.createElement('span');
                    msg.className = 'c-msg';
                    msg.textContent = item.lastMessage || '点击开始聊天';
                    row2.appendChild(msg);

                    if(item.badge){
                        var badge = document.createElement('span');
                        badge.className = 'badge';
                        badge.textContent = item.badge;
                        row2.appendChild(badge);
                    }

                    content.appendChild(row1);
                    content.appendChild(row2);
                    chat.appendChild(avatarBox);
                    chat.appendChild(content);
                    link.appendChild(chat);

                    messageList.appendChild(link);
                    if(j < chats.length - 1){
                        var divider = document.createElement('div');
                        divider.className = 'divider';
                        messageList.appendChild(divider);
                    }
                }
            }

            function ensureStaticContact(options){
                if(!options || !options.contactId || !options.chatId) return;
                var contacts = readContacts();
                var contactExists = false;
                for(var i=0;i<contacts.length;i++){
                    if(contacts[i] && contacts[i].id === options.contactId){
                        contactExists = true;
                        if(!contacts[i].chatId) contacts[i].chatId = options.chatId;
                        if(!contacts[i].name) contacts[i].name = options.name || '';
                        if(!contacts[i].callName && options.callName) contacts[i].callName = options.callName;
                        if(!contacts[i].avatar && options.avatar) contacts[i].avatar = options.avatar;
                        break;
                    }
                }
                if(!contactExists){
                    contacts.push({ id: options.contactId, chatId: options.chatId, name: options.name || '', callName: options.callName || '', avatar: options.avatar || '' });
                    writeContacts(contacts);
                } else {
                    writeContacts(contacts);
                }

                var chats = readChats();
                var chatExists = false;
                for(var j=0;j<chats.length;j++){
                    if(chats[j] && chats[j].id === options.chatId){
                        chatExists = true;
                        if(!chats[j].contactId) chats[j].contactId = options.contactId;
                        if(!chats[j].name) chats[j].name = options.name || '';
                        if(!chats[j].callName && options.callName) chats[j].callName = options.callName;
                        if(!chats[j].avatar && options.avatar) chats[j].avatar = options.avatar;
                        if(!chats[j].badge && options.badge) chats[j].badge = options.badge;
                        break;
                    }
                }
                if(!chatExists){
                    chats.push({ id: options.chatId, contactId: options.contactId, name: options.name || '', callName: options.callName || '', avatar: options.avatar || '', lastMessage: options.lastMessage || '点击开始聊天', time: options.time || '', badge: options.badge || '' });
                    writeChats(chats);
                } else {
                    if(!chats[j].lastMessage) chats[j].lastMessage = options.lastMessage || '点击开始聊天';
                    if(!chats[j].time) chats[j].time = options.time || '';
                    writeChats(chats);
                }

                var histories = readChatHistories();
                if(!Array.isArray(histories[options.chatId])) histories[options.chatId] = [];
                writeChatHistories(histories);
            }

            function applyInitialTabFromRoute(){
                var params = new URLSearchParams(window.location.search || '');
                var tab = params.get('tab');
                if(tab === 'contacts'){
                    var input = document.getElementById('tab-2');
                    if(input) input.checked = true;
                } else if(tab === 'moments'){
                    var input3 = document.getElementById('tab-3');
                    if(input3) input3.checked = true;
                } else if(tab === 'me'){
                    var input4 = document.getElementById('tab-4');
                    if(input4) input4.checked = true;
                } else if(tab === 'messages'){
                    var input1 = document.getElementById('tab-1');
                    if(input1) input1.checked = true;
                }
            }

            // wire save to add a contact (basic persistence)
            if(selfSave) selfSave.addEventListener('click', function(){
                    var name = (document.getElementById('contactName') && document.getElementById('contactName').value || '').trim();
                    if(!name){ alert('请填写昵称'); return; }
                    var callName = (document.getElementById('contactCallName') && document.getElementById('contactCallName').value || '').trim();
                    var contactId = createId('c');
                    var chatId = createId('chat');
                    var avatar = (document.getElementById('contactAvatarUrl') && document.getElementById('contactAvatarUrl').value || '').trim();
                    var contacts = readContacts();
                    contacts.push({ id: contactId, chatId: chatId, name: name, callName: callName, avatar: avatar });
                    writeContacts(contacts);

                    var chats = readChats();
                    chats.unshift({ id: chatId, contactId: contactId, name: name, callName: callName, avatar: avatar, lastMessage: '点击开始聊天', time: formatCurrentTime() });
                    writeChats(chats);

                    var histories = readChatHistories();
                    if(!Array.isArray(histories[chatId])) histories[chatId] = [];
                    writeChatHistories(histories);

                    renderContacts();
                    renderSavedChats();
                    closeModal(selfModal);
                    document.getElementById('contactName').value=''; document.getElementById('contactCallName').value=''; document.getElementById('contactAvatarUrl').value='';
                });

            ensureStaticContact({ contactId:'contact_static_winter', chatId:'chat_static_winter', name:'Winter', lastMessage:'把今天的情绪，放进相册里。', time:'21:12', badge:'2' });
            ensureStaticContact({ contactId:'contact_static_nako', chatId:'chat_static_nako', name:'Nako', lastMessage:'周末要去喝咖啡吗？☕️', time:'Wed' });
            ensureStaticContact({ contactId:'contact_static_isla', chatId:'chat_static_isla', name:'Isla' });
            ensureStaticContact({ contactId:'contact_static_aki', chatId:'chat_static_aki', name:'Aki' });
            ensureStaticContact({ contactId:'contact_static_alice', chatId:'chat_static_alice', name:'Alice' });

            // Me page logic imported from nav-me.js
            // initial render
            applyInitialTabFromRoute();
            renderContacts();
            renderSavedChats();
        });
    </script>
    <script src="nav-me.js"></script>
    <script>
        (function () {
            document.body.classList.add('page-ready');
            document.addEventListener('click', function (event) {
                var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
                if (!link) return;
                var href = link.getAttribute('href') || '';
                if (!href || href.charAt(0) === '#') return;
                document.body.classList.add('page-leaving');
            }, true);
        })();
    </script>
