            function buildTopicSummary(history) {
                var topics = findFrequentTopicsByMap(history, {
                    "星座": /星座|处女座|天蝎|双鱼|白羊|射手|狮子|巨蟹|双子|金牛|摩羯|水瓶/,
                    "八卦": /八卦|瓜|前任|绯闻|谁和谁|偷偷|爆料/,
                    "日常": /吃饭|睡觉|上班|上课|天气|外卖|回家|出门/,
                    "情绪": /难过|开心|委屈|烦|想哭|治愈|安慰/,
                    "暧昧": /想你|亲亲|抱抱|喜欢|爱你|贴贴|心动/
                });
                if (!topics.length) {
                    return "";
                }
                return "话题上主要围着" + topics.join("、") + "这些内容打转，不是单纯随便闲聊";
            }

            function buildRecentHighlights(userMessages, assistantMessages) {
                var recent = [];
                var latestUser = userMessages.length ? userMessages[userMessages.length - 1].content : "";
                var latestAssistant = assistantMessages.length ? assistantMessages[assistantMessages.length - 1].content : "";
                if (latestUser) {
                    recent.push("你最后重点提到的是“" + truncateText(latestUser, 24) + "”");
                }
                if (latestAssistant) {
                    recent.push("对方最后接住的话题是“" + truncateText(latestAssistant, 24) + "”");
                }
                return recent.slice(0, 2);
            }

            function refreshMemorySummary(options) {
                var silent = options && options.silent === true;
                var force = options && options.force === true;
                var nextSummary = buildMemorySummary(chatState.history);

                memorySummaryState.text = nextSummary.summary;
                memorySummaryState.updatedAt = Date.now();

                if (memoryModal && memoryModal.classList.contains("show")) {
                    renderMemorySummary(nextSummary);
                }

                if (!silent) {
                    showToast(force ? "总结记忆已刷新" : "总结已更新");
                }
                return nextSummary;
            }

            function scheduleMemorySummary(options) {
                var force = options && options.force === true;
                var silent = options && options.silent === true;
                if (memorySummaryState.timer) {
                    window.clearTimeout(memorySummaryState.timer);
                }
                if (!silent) {
                    showToast(force ? "正在刷新总结..." : "正在整理这段聊天总结...");
                }
                memorySummaryState.timer = window.setTimeout(function() {
                    memorySummaryState.timer = null;
                    refreshMemorySummary({ force: force, silent: silent });
                }, force ? 60 : 240);
            }

            function buildMemorySummary(history) {
                var safeHistory = Array.isArray(history) ? history.filter(function(item) {
                    return item && typeof item.content === "string" && item.content.trim();
                }) : [];
                var userMessages = safeHistory.filter(function(item) { return item.role === "user"; });
                var assistantMessages = safeHistory.filter(function(item) { return item.role === "assistant"; });
                var summary = [];
                var facts = [];
                var recent = [];
                var topics = buildTopicSummary(safeHistory);
                var relationshipTone = detectRelationshipTone(userMessages, assistantMessages);
                var events = buildEventSummary(safeHistory, userMessages, assistantMessages);
                var lifeDetails = buildLifeDetails(safeHistory);

                if (!safeHistory.length) {
                    return {
                        summary: "这段会话还没有可总结的内容，先聊几句再回来看看吧。",
                        facts: [],
                        recent: []
                    };
                }

                summary.push(relationshipTone + "。");
                events.forEach(function(item) {
                    summary.push(item + "。");
                });
                if (topics) {
                    summary.push(topics + "。");
                }
                lifeDetails.forEach(function(item) {
                    summary.push(item + "。");
                });

                if (chatState.title) {
                    uniquePush(facts, "聊天对象是“" + chatState.title + "”。");
                }
                if (chatState.selfName) {
                    uniquePush(facts, "当前你的昵称是“" + chatState.selfName + "”。");
                }
                if (chatState.pendingUserCount > 0) {
                    uniquePush(facts, "还有 " + chatState.pendingUserCount + " 条你的消息正在等待对方继续回复。");
                }
                if (topics) {
                    uniquePush(facts, topics + "。");
                }

                buildRecentHighlights(userMessages, assistantMessages).forEach(function(item) {
                    recent.push(item);
                });
                if (safeHistory.length >= 4) {
                    recent.push("最近互动是连续的，适合沿着刚刚那种关系和情绪继续往下聊。");
                }

                return {
                    summary: summary.slice(0, 4).join("") || "这段会话有聊天内容，但暂时还不够形成稳定总结。",
                    facts: facts.slice(0, 4),
                    recent: recent.slice(0, 4)
                };
            }

            function renderMemorySummary(precomputedData) {
                if (!memoryContent) {
                    return;
                }
                var data = precomputedData || buildMemorySummary(chatState.history);
                var factsHtml = data.facts.length
                    ? data.facts.map(function(item) { return '<div class="memory-bullet">' + escapeHtml(item) + '</div>'; }).join("")
                    : '<div class="memory-empty">暂时还没有稳定的人设/关系记忆。</div>';
                var recentHtml = data.recent.length
                    ? data.recent.map(function(item) { return '<div class="memory-bullet">' + escapeHtml(item) + '</div>'; }).join("")
                    : '<div class="memory-empty">暂无最近动态。</div>';

                memoryContent.innerHTML = '' +
                    '<section class="memory-section">' +
                        '<div class="memory-section-title">本轮总结</div>' +
                        '<div class="memory-summary">' + escapeHtml(data.summary) + '</div>' +
                    '</section>' +
                    '<section class="memory-section">' +
                        '<div class="memory-section-title">已记住的信息</div>' +
                        '<div class="memory-list">' + factsHtml + '</div>' +
                    '</section>' +
                    '<section class="memory-section">' +
                        '<div class="memory-section-title">最近状态</div>' +
                        '<div class="memory-list">' + recentHtml + '</div>' +
                    '</section>';
            }

            function focusElement(target) {
                if (!target || typeof target.focus !== "function") {
                    return;
                }
                try {
                    target.focus({ preventScroll: true });
                } catch (error) {
                    target.focus();
                }
            }

            function setLayerHiddenState(layer, hidden) {
                if (!layer) {
                    return;
                }
                layer.setAttribute("aria-hidden", hidden ? "true" : "false");
                if ("inert" in layer) {
                    layer.inert = !!hidden;
                }
            }

            function restoreFocusBeforeHide(layer, fallbackTarget) {
                if (!layer) {
                    return;
                }
                var activeElement = document.activeElement;
                if (activeElement && layer.contains(activeElement)) {
                    if (fallbackTarget && document.contains(fallbackTarget) && !fallbackTarget.disabled) {
                        focusElement(fallbackTarget);
                    } else if (chatInput) {
                        focusElement(chatInput);
                    } else if (memoryLink) {
                        focusElement(memoryLink);
                    }
                }
            }

            function openMemoryModal() {
                if (!memoryModal) {
                    return;
                }
                lastMemoryTrigger = document.activeElement && document.activeElement !== document.body
                    ? document.activeElement
                    : memoryLink;
                scheduleMemorySummary({ force: true, silent: false });
                renderMemorySummary();
                memoryModal.classList.add("show");
                setLayerHiddenState(memoryModal, false);
                window.setTimeout(function() {
                    focusElement(memoryClose || memoryModal);
                }, 0);
            }

            function closeMemoryModal() {
                if (!memoryModal) {
                    return;
                }
                restoreFocusBeforeHide(memoryModal, lastMemoryTrigger || memoryLink);
                memoryModal.classList.remove("show");
                setLayerHiddenState(memoryModal, true);
                lastMemoryTrigger = null;
            }

            function parseChatRoute() {
                var params = new URLSearchParams(window.location.search || "");
                return {
                    chatId: params.get("chatId") || "default",
                    contactId: params.get("contactId") || ""
                };
            }

            function readChats() {
                var list = readJSON(CHATS_KEY);
                return Array.isArray(list) ? list : [];
            }

            function readContacts() {
                var list = readJSON(CONTACTS_KEY);
                return Array.isArray(list) ? list : [];
            }

            function readSettingsBuckets() {
                var raw = readJSON("miffy_chat_settings_by_chat_v1");
                if (raw && typeof raw === "object" && !Array.isArray(raw)) {
                    return raw;
                }
                return {};
            }

            function findChatMeta(route) {
                var chats = readChats();
                var contacts = readContacts();
                var chat = null;
                var contact = null;
                var i;

                for (i = 0; i < chats.length; i += 1) {
                    if (chats[i] && chats[i].id === route.chatId) {
                        chat = chats[i];
                        break;
                    }
                }

                for (i = 0; i < contacts.length; i += 1) {
                    if (!contacts[i]) {
                        continue;
                    }
                    if ((route.contactId && contacts[i].id === route.contactId) ||
                        (chat && contacts[i].id === chat.contactId) ||
                        contacts[i].chatId === route.chatId) {
                        contact = contacts[i];
                        break;
                    }
                }

                return { chat: chat, contact: contact };
            }

            function getScopedChatSettings(chatId) {
                var buckets = readSettingsBuckets();
                if (chatId && buckets[chatId] && typeof buckets[chatId] === "object") {
                    return buckets[chatId];
                }
                return readJSON(STORAGE_KEY) || null;
            }

            function readHistoryBuckets() {
                var raw = readJSON(CHAT_HISTORY_KEY);
                if (raw && typeof raw === "object" && !Array.isArray(raw)) {
                    return raw;
                }
                return {};
            }

            function writeHistoryBuckets(map) {
                localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(map || {}));
            }

            function formatMessageTime(value) {
                if (value) {
                    return value;
                }
                var now = new Date();
                return String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
            }

            function normalizeStoredMessage(item) {
                if (!item) {
                    return null;
                }
                if ((item.from === "me" || item.from === "them") && typeof item.text === "string" && item.text.trim()) {
                    return {
                        role: item.from === "me" ? "user" : "assistant",
                        content: item.text.trim(),
                        time: item.time || ""
                    };
                }
                if ((item.role === "user" || item.role === "assistant") && typeof item.content === "string" && item.content.trim()) {
                    return {
                        role: item.role,
                        content: item.content.trim(),
                        time: item.time || ""
                    };
                }
                return null;
            }

            function serializeHistoryItem(item) {
                if (!item || !item.content) {
                    return null;
                }
                return {
                    from: item.role === "user" ? "me" : "them",
                    text: item.content,
                    time: formatMessageTime(item.time)
                };
            }

            function isAssistantAvatar(target) {
                if (!target || !target.closest) {
                    return false;
                }
                var avatar = target.closest(".msg-avatar");
                if (!avatar || !chatBody || !chatBody.contains(avatar)) {
                    return false;
                }
                var row = avatar.closest(".msg-row");
                return !!(row && row.classList.contains("incoming") && avatar.offsetParent !== null && !avatar.hasAttribute("data-regenerating"));
            }

            function readJSON(key) {
                try {
                    var raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : null;
                } catch (error) {
                    return null;
                }
            }

            function readText(key, fallback) {
                var value = localStorage.getItem(key);
                return value ? value : fallback;
            }

            function normalizeBubblePreset(value) {
                var preset = String(value || "").trim();
                if (preset === "bw" || preset === "pink" || preset === "wechat") {
                    return preset;
                }
                return "pink";
            }

            function ensureBubbleCustomStyleEl() {
                var styleEl = document.getElementById("bubbleCustomStyle");
                if (styleEl) {
                    return styleEl;
                }

                styleEl = document.createElement("style");
                styleEl.id = "bubbleCustomStyle";
                document.head.appendChild(styleEl);
                return styleEl;
            }

            function applyBubbleStyle(settings) {
                if (!chatBody) {
                    return;
                }

                var legacyMode = settings && settings.mode === "detail";
                var styleData = settings && settings.style && typeof settings.style === "object"
                    ? settings.style
                    : {};
                var preset = normalizeBubblePreset(styleData.preset);
                var customCss = typeof styleData.customCss === "string" ? styleData.customCss : "";

                chatBody.classList.remove("chat-detail-mode", "bubble-theme-bw", "bubble-theme-pink", "bubble-theme-wechat", "bubble-theme-custom");

                if (legacyMode) {
                    chatBody.classList.add("chat-detail-mode");
                } else {
                    if (preset === "custom") {
                        chatBody.classList.add("bubble-theme-custom");
                    } else {
                        chatBody.classList.add("bubble-theme-" + preset);
                    }
                }

                ensureBubbleCustomStyleEl().textContent = customCss;
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function buildNumberOptions(selectEl, min, max) {
                if (!selectEl) {
                    return;
                }
                var html = "";
                for (var i = min; i <= max; i += 1) {
                    html += '<option value="' + i + '">' + i + " 条</option>";
                }
                selectEl.innerHTML = html;
            }

            function readRetainCount() {
                var raw = parseInt(localStorage.getItem(RETAIN_COUNT_KEY), 10);
                if (!Number.isFinite(raw)) {
                    return CHAT_HISTORY_MAX;
                }
                return clamp(raw, 10, 200);
            }

            function saveRetainCount(value) {
                var normalized = clamp(parseInt(value, 10) || CHAT_HISTORY_MAX, 10, 200);
                CHAT_HISTORY_MAX = normalized;
                localStorage.setItem(RETAIN_COUNT_KEY, String(normalized));
                return normalized;
            }

            function nextMessageId() {
                messageIdSeed += 1;
                return "msg_" + Date.now() + "_" + messageIdSeed;
            }

            function ensureBubbleMeta(row, bubble, role, text) {
                if (!row || !bubble) {
                    return;
                }
                if (!row.getAttribute("data-message-id")) {
                    row.setAttribute("data-message-id", nextMessageId());
                }
                bubble.classList.add("editable-bubble");
                bubble.setAttribute("tabindex", "0");
                bubble.setAttribute("role", "button");
                bubble.setAttribute("aria-label", "编辑消息");
                bubble.setAttribute("data-role", role || "assistant");
                if (!bubble.getAttribute("data-edit-stack")) {
                    bubble.setAttribute("data-edit-stack", "[]");
                }
                if (typeof text === "string" && !bubble.getAttribute("data-original-text")) {
                    bubble.setAttribute("data-original-text", text);
                }
            }

            function readBubbleStack(bubble) {
                if (!bubble) {
                    return [];
                }
                try {
                    var raw = bubble.getAttribute("data-edit-stack") || "[]";
                    var parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed.filter(function(item) {
                        return typeof item === "string";
                    }) : [];
                } catch (error) {
                    return [];
                }
            }

            function writeBubbleStack(bubble, stack) {
                if (!bubble) {
                    return;
                }
                bubble.setAttribute("data-edit-stack", JSON.stringify((stack || []).slice(-20)));
            }

            function syncHistoryFromDom() {
                chatState.history = trimHistory(collectVisibleHistory());
                chatState.pendingUserCount = computePendingUserCount(chatState.history);
                saveHistory();
            }

            function updateUndoButtonState() {
                if (!editUndoBtn) {
                    return;
                }
                var bubble = chatState.editingBubble;
                var stack = readBubbleStack(bubble);
                editUndoBtn.disabled = !bubble || !stack.length;
            }

            function updateActionMenuState() {
                if (!bubbleUndoAction) {
                    return;
                }
                bubbleUndoAction.disabled = !chatState.actionBubble;
            }

            function closeBubbleActionMenu() {
                if (!bubbleActionMenu) {
                    return;
                }
                bubbleActionMenu.classList.remove("show");
                bubbleActionMenu.setAttribute("aria-hidden", "true");
                chatState.actionBubble = null;
            }

            function openBubbleActionMenu(bubble) {
                if (!bubbleActionMenu || !bubble) {
                    return;
                }

                chatState.actionBubble = bubble;
                updateActionMenuState();

                var rect = bubble.getBoundingClientRect();
                var menuWidth = 132;
                var menuHeight = 104;
                var left = rect.left + rect.width / 2 - menuWidth / 2;
                var top = rect.top - menuHeight - 10;

                left = clamp(left, 10, window.innerWidth - menuWidth - 10);
                if (top < 10) {
                    top = Math.min(window.innerHeight - menuHeight - 10, rect.bottom + 10);
                }

                bubbleActionMenu.style.left = left + "px";
                bubbleActionMenu.style.top = top + "px";
                bubbleActionMenu.classList.add("show");
                bubbleActionMenu.setAttribute("aria-hidden", "false");
            }

            function openEditModal(bubble) {
                if (!editModal || !editTextarea || !bubble) {
                    return;
                }
                lastEditTrigger = document.activeElement && document.activeElement !== document.body
                    ? document.activeElement
                    : bubble;
                closeBubbleActionMenu();
                chatState.editingBubble = bubble;
                editTextarea.value = bubble.textContent.trim();
                updateUndoButtonState();
                editModal.classList.add("show");
                setLayerHiddenState(editModal, false);
                window.setTimeout(function() {
                    editTextarea.focus();
                    editTextarea.setSelectionRange(editTextarea.value.length, editTextarea.value.length);
                }, 0);
            }

            function closeEditModal() {
                if (!editModal) {
                    return;
                }
                restoreFocusBeforeHide(editModal, lastEditTrigger || chatInput);
                editModal.classList.remove("show");
                setLayerHiddenState(editModal, true);
                chatState.editingBubble = null;
                lastEditTrigger = null;
            }

            function saveBubbleEdit() {
                var bubble = chatState.editingBubble;
                if (!bubble || !editTextarea) {
                    return;
                }
                var nextText = (editTextarea.value || "").trim();
                var currentText = bubble.textContent.trim();

                if (!nextText) {
                    showToast("消息内容不能为空");
                    return;
                }
                if (nextText === currentText) {
                    closeEditModal();
                    return;
                }

                var stack = readBubbleStack(bubble);
                stack.push(currentText);
                writeBubbleStack(bubble, stack);
                bubble.textContent = nextText;
                syncHistoryFromDom();
                closeEditModal();
                showToast("消息已更新");
            }

            function undoBubbleEdit() {
                var bubble = chatState.editingBubble;
                if (!bubble || !editTextarea) {
                    return;
                }
                var stack = readBubbleStack(bubble);
                if (!stack.length) {
                    showToast("没有可撤销的修改");
                    return;
                }
                var previousText = stack.pop();
                writeBubbleStack(bubble, stack);
                bubble.textContent = previousText;
                editTextarea.value = previousText;
                syncHistoryFromDom();
                updateUndoButtonState();
                showToast("已撤销修改");
            }

            function deleteBubbleFromMenu() {
                var bubble = chatState.actionBubble;
                if (!bubble) {
                    return;
                }
                var row = bubble.closest(".msg-row");
                if (row && row.parentNode) {
                    row.parentNode.removeChild(row);
                }
                syncHistoryFromDom();
                closeBubbleActionMenu();
                showToast("消息已删除");
            }

            function bindBubbleEditor() {
                if (!chatBody) {
                    return;
                }

                chatBody.addEventListener("click", function(event) {
                    var bubble = event.target && event.target.closest ? event.target.closest(".bubble") : null;
                    if (!bubble || !chatBody.contains(bubble)) {
                        return;
                    }
                    event.stopPropagation();
                    openBubbleActionMenu(bubble);
                });

                chatBody.addEventListener("keydown", function(event) {
                    var bubble = event.target && event.target.closest ? event.target.closest(".bubble") : null;
                    if (!bubble || !chatBody.contains(bubble)) {
                        return;
                    }
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openBubbleActionMenu(bubble);
                    }
                });
            }

            function trimHistory(list) {
                return list.slice(-CHAT_HISTORY_MAX);
            }

            function loadHistory() {
                var raw = readJSON(CHAT_HISTORY_KEY);
                var list = null;

                if (Array.isArray(raw)) {
                    list = raw;
                } else {
                    list = readHistoryBuckets()[chatState.chatId];
                }

                if (!Array.isArray(list)) {
                    return null;
                }

                return list.map(normalizeStoredMessage).filter(Boolean);
            }

            function saveHistory() {
                chatState.history = trimHistory(chatState.history || []);
                var buckets = readHistoryBuckets();
                buckets[chatState.chatId] = chatState.history.map(serializeHistoryItem).filter(Boolean);
                writeHistoryBuckets(buckets);
                scheduleMemorySummary({ silent: false });
            }

            function computePendingUserCount(history) {
                var count = 0;
                for (var i = history.length - 1; i >= 0; i -= 1) {
                    if (history[i].role === "user") {
                        count += 1;
                        continue;
                    }
                    break;
                }
                return count;
            }

            function renderHistoryFromStorage(history) {
                if (!chatBody) {
                    return;
                }

                Array.prototype.slice.call(chatBody.querySelectorAll(".msg-row, .time-divider, .typing")).forEach(function(node) {
                    if (node && node.parentNode) {
                        node.parentNode.removeChild(node);
                    }
                });

                history.forEach(function(item) {
                    addMessageRow(item.role, item.content);
                });
            }

            function showToast(text) {
                if (!toast) {
                    return;
                }
                toast.textContent = text;
                toast.classList.add("show");
                window.clearTimeout(showToast._timer);
                showToast._timer = window.setTimeout(function() {
                    toast.classList.remove("show");
                }, 1600);
            }

            function syncAttachmentPanelHeight() {
                if (!attachmentPanel) {
                    return;
                }
                var height = attachmentPanel.classList.contains("show") ? attachmentPanel.scrollHeight : 0;
                document.documentElement.style.setProperty("--attachment-panel-height", height + "px");
            }

            function openAttachmentPanel() {
                if (!attachmentPanel || !attachmentToggle) {
                    return;
                }
                attachmentPanel.classList.add("show");
                attachmentPanel.setAttribute("aria-hidden", "false");
                attachmentToggle.setAttribute("aria-expanded", "true");
                syncAttachmentPanelHeight();
                if (chatBody) {
                    chatBody.scrollTop = chatBody.scrollHeight;
                }
            }

            function closeAttachmentPanel() {
                if (!attachmentPanel || !attachmentToggle) {
                    return;
                }
                attachmentPanel.classList.remove("show");
                attachmentPanel.setAttribute("aria-hidden", "true");
                attachmentToggle.setAttribute("aria-expanded", "false");
                syncAttachmentPanelHeight();
            }

            function toggleAttachmentPanel() {
                if (!attachmentPanel) {
                    return;
                }
                if (attachmentPanel.classList.contains("show")) {
                    closeAttachmentPanel();
                } else {
                    closeAttachmentPanel();
                    openAttachmentPanel();
                }
            }

            function escapeHtml(str) {
                if (str === null || str === undefined) {
                    return "";
                }
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function extractAvatarText(name) {
                var value = (name || "").trim();
                if (!value) {
                    return "W";
                }
                return value.slice(0, 1).toUpperCase();
            }

            function buildAvatarGradient(seedText) {
                var seed = (seedText || "W").charCodeAt(0) || 87;
                var hue = (seed * 29) % 360;
                return "linear-gradient(135deg, hsl(" + hue + ", 62%, 78%), hsl(" + ((hue + 35) % 360) + ", 74%, 66%))";
            }

            function applyAvatarElement(el, labelEl, text, gradient, avatarUrl) {
                if (!el) {
                    return;
                }

                if (avatarUrl) {
                    el.style.backgroundImage = 'url("' + avatarUrl.replace(/"/g, '\\"') + '")';
                    el.style.backgroundSize = "cover";
                    el.style.backgroundPosition = "center";
                    if (labelEl) {
                        labelEl.style.display = "none";
                    }
                    return;
                }

                el.style.backgroundImage = "none";
                el.style.background = gradient;
                if (labelEl) {
                    labelEl.style.display = "flex";
                    labelEl.textContent = text;
                }
            }

            function applyHeaderAndStyle() {
                var route = parseChatRoute();
                var linked = findChatMeta(route);
                var settings = getScopedChatSettings(route.chatId || chatState.chatId) || {};
                var simple = settings.simple || {};
                var detail = settings.detail || {};
                var mode = settings && settings.mode === "detail" ? "detail" : "simple";
                var title = simple.targetName || "Winter";
                var subtitle = "简约模式 · " + (simple.callName || "Miffy");
                var routeCallName = (linked.chat && linked.chat.callName) || (linked.contact && linked.contact.callName) || "";
                var routeName = (linked.chat && linked.chat.name) || (linked.contact && linked.contact.name) || "";
                var routeAvatar = (linked.chat && linked.chat.avatar) || (linked.contact && linked.contact.avatar) || "";
                var previewTitle = route.chatId
                    ? (routeName || title)
                    : (routeName || readText(STORAGE_KEY + "_preview_name", title));
                var previewSubtitle = route.chatId
                    ? (routeCallName ? ("联系人 · " + routeCallName) : subtitle)
                    : (routeCallName ? ("联系人 · " + routeCallName) : readText(STORAGE_KEY + "_preview_subtitle", subtitle));
                var targetAvatarText = extractAvatarText(previewTitle || title);
                var selfName = mode === "detail"
                    ? detail.selfName || "Miffy"
                    : simple.selfName || "Miffy";
                var selfAvatarText = extractAvatarText(selfName);
                var avatarsRaw = settings.avatars || {};
                var legacyAvatars = {
                    targetUrl: avatarsRaw.targetUrl || "",
                    selfUrl: avatarsRaw.selfUrl || ""
                };
                var simpleAvatars = Object.assign({}, legacyAvatars, avatarsRaw.simple || {});
                var detailAvatars = Object.assign({}, avatarsRaw.detail || {});
                var activeAvatars = mode === "detail" ? detailAvatars : simpleAvatars;
                var targetAvatarUrl = route.chatId
                    ? (routeAvatar || activeAvatars.targetUrl || "")
                    : (routeAvatar || activeAvatars.targetUrl || readText(STORAGE_KEY + "_avatar_target", ""));
                var selfAvatarUrl = route.chatId
                    ? (activeAvatars.selfUrl || "")
                    : (activeAvatars.selfUrl || readText(STORAGE_KEY + "_avatar_self", ""));

                applyBubbleStyle(settings);

                if (titleEl && previewTitle) {
                    titleEl.childNodes[0].nodeValue = previewTitle + " ";
                }
                if (subtitleEl && previewSubtitle) {
                    subtitleEl.textContent = previewSubtitle;
                }

                var avatarGradient = buildAvatarGradient(targetAvatarText);
                var selfGradient = buildAvatarGradient(selfAvatarText);

                applyAvatarElement(incomingAvatar, incomingAvatarLabel, targetAvatarText, avatarGradient, targetAvatarUrl);
                applyAvatarElement(incomingAvatar2, incomingAvatarLabel2, targetAvatarText, avatarGradient, targetAvatarUrl);
                applyAvatarElement(selfAvatar1, selfAvatarLabel1, selfAvatarText, selfGradient, selfAvatarUrl);
                applyAvatarElement(selfAvatar2, selfAvatarLabel2, selfAvatarText, selfGradient, selfAvatarUrl);
                chatState.chatId = route.chatId || "default";
                chatState.contactId = route.contactId || (linked.chat && linked.chat.contactId) || (linked.contact && linked.contact.id) || "";
                chatState.title = previewTitle || title || "Winter";
                chatState.avatarText = targetAvatarText;
                chatState.avatarGradient = avatarGradient;
                chatState.avatarUrl = targetAvatarUrl;
                chatState.selfName = selfName;
                chatState.selfAvatarText = selfAvatarText;
                chatState.selfAvatarGradient = selfGradient;
                chatState.selfAvatarUrl = selfAvatarUrl;
            }

            function refreshChatAppearanceFromStorage(event) {
                if (event && event.key && event.key !== STORAGE_KEY) {
                    return;
                }
                applyHeaderAndStyle();
                renderHistoryFromStorage(chatState.history);
            }

            function addMessageRow(role, text) {
                if (!chatBody || !text) {
                    return;
                }

                var row = document.createElement("div");
                row.className = "msg-row " + (role === "assistant" ? "incoming" : "outgoing");

                if (role === "assistant") {
                    row.innerHTML = '' +
                        '<div class="msg-avatar"><div class="avatar-label"></div></div>' +
                        '<div class="bubble">' + escapeHtml(text) + '</div>';
                } else {
                    row.innerHTML = '' +
                        '<div class="bubble">' + escapeHtml(text) + '</div>' +
                        '<div class="msg-avatar"><div class="avatar-label"></div></div>';
                }

                var avatarEl = row.querySelector(".msg-avatar");
                var labelEl = row.querySelector(".avatar-label");
                if (role === "assistant") {
                    applyAvatarElement(avatarEl, labelEl, chatState.avatarText, chatState.avatarGradient, chatState.avatarUrl);
                } else {
                    applyAvatarElement(avatarEl, labelEl, chatState.selfAvatarText, chatState.selfAvatarGradient, chatState.selfAvatarUrl);
                }

                var bubbleEl = row.querySelector(".bubble");
                ensureBubbleMeta(row, bubbleEl, role, text);

                chatBody.appendChild(row);
                chatBody.scrollTop = chatBody.scrollHeight;
            }

            function setLoading(loading) {
                if (!sendBtn) {
                    return;
                }
                sendBtn.disabled = false;
                sendBtn.setAttribute("aria-busy", loading ? "true" : "false");
                sendBtn.setAttribute("aria-label", loading ? "中断回复" : "发送消息");
                sendBtn.classList.toggle("is-loading", !!loading);
            }

            function abortActiveReply(options) {
                if (!activeReplyRequest) {
                    return false;
                }

                var request = activeReplyRequest;
                activeReplyRequest = null;

                if (request.typingEl) {
                    removeTyping(request.typingEl);
                }
                if (request.controller) {
                    request.controller.abort(options && options.reason ? options.reason : "manual-abort");
                }

                setLoading(false);

                if (!options || options.silent !== true) {
                    showToast("已打断回复");
                }
                return true;
            }

            function collectVisibleHistory() {
                if (!chatBody) {
                    return [];
                }

                var rows = Array.prototype.slice.call(chatBody.querySelectorAll(".msg-row"));
                return rows.map(function(row) {
                    var bubble = row.querySelector(".bubble");
                    if (!bubble) {
                        return null;
                    }
                    var text = bubble.textContent.trim();
                    if (!text) {
                        return null;
                    }
                    var role = row.classList.contains("incoming") ? "assistant" : "user";
                    return { role: role, content: text };
                }).filter(Boolean);
            }

            function removeAssistantRoundRows(userRow) {
                if (!chatBody || !userRow) {
                    return;
                }

                var node = userRow.nextElementSibling;
                while (node) {
                    var next = node.nextElementSibling;
                    if (node.classList && node.classList.contains("msg-row")) {
                        if (node.classList.contains("outgoing")) {
                            break;
                        }
                        if (node.parentNode) {
                            node.parentNode.removeChild(node);
                        }
                    }
                    node = next;
                }
            }

            function findPreviousUserRow(fromRow) {
                var node = fromRow;
                while (node) {
                    if (node.classList && node.classList.contains("msg-row") && node.classList.contains("outgoing")) {
                        return node;
                    }
                    node = node.previousElementSibling;
                }
                return null;
            }

            function requestAssistantReply(historyOverride) {
                var preset = getActivePreset();
                if (!preset || !preset.baseUrl || !preset.apiKey || !preset.model) {
                    showToast("请先在 API 配置里启用可用预设");
                    return;
                }

                var baseHistory = Array.isArray(historyOverride) ? historyOverride.slice() : chatState.history.slice();
                if (!computePendingUserCount(baseHistory)) {
                    return;
                }

                setLoading(true);
                var typingEl = appendTyping();
                var requestState = {
                    controller: null,
                    typingEl: typingEl,
                    aborted: false
                };
                activeReplyRequest = requestState;
                var messageWindow = baseHistory.slice(-24);
                var payload = [{ role: "system", content: buildSystemPrompt() }].concat(messageWindow);

                callChatApi(preset, payload, requestState)
                    .then(function(data) {
                        if (activeReplyRequest !== requestState) {
                            return;
                        }
                        removeTyping(typingEl);
                        var content = parseAssistantContent(data);
                        var replies = splitAssistantLines(content);

                        if (!replies.length) {
                            replies = ["我刚刚有点走神啦，可以再说一次吗？"];
                        }

                        replies.forEach(function(reply) {
                            addMessageRow("assistant", reply);
                            chatState.history.push({ role: "assistant", content: reply, time: formatMessageTime() });
                        });

                        chatState.history = trimHistory(chatState.history);
                        chatState.pendingUserCount = 0;
                        saveHistory();
                    })
                    .catch(function(error) {
                        if (activeReplyRequest !== requestState) {
                            return;
                        }
                        removeTyping(typingEl);
                        if (error && error.isManualAbort) {
                            return;
                        }
                        showToast("发送失败：" + (error && error.message ? error.message : "未知错误"));
                    })
                    .finally(function() {
                        if (activeReplyRequest === requestState) {
                            activeReplyRequest = null;
                            setLoading(false);
                        }
                    });
            }

            function regenerateAssistantRoundFromAvatar(avatarEl) {
                var row = avatarEl && avatarEl.closest ? avatarEl.closest(".msg-row") : null;
                if (!row || !row.classList.contains("incoming")) {
                    return;
                }

                var userRow = findPreviousUserRow(row);
                if (!userRow) {
                    showToast("这一轮前没有找到用户提问");
                    return;
                }

                var history = collectVisibleHistory();
                var userBubble = userRow.querySelector(".bubble");
                var userText = userBubble ? userBubble.textContent.trim() : "";
                var userIndex = -1;

                for (var i = history.length - 1; i >= 0; i -= 1) {
                    if (history[i].role === "user" && history[i].content === userText) {
                        userIndex = i;
                        break;
                    }
                }

                if (userIndex === -1) {
                    showToast("没有找到可重生的提问");
                    return;
                }

                removeAssistantRoundRows(userRow);
                chatState.history = trimHistory(history.slice(0, userIndex + 1));
                chatState.pendingUserCount = 1;
                saveHistory();
                requestAssistantReply(chatState.history);
                showToast("已删除本轮回复，重新生成中");
            }

            function initExistingBubbles() {
                if (!chatBody) {
                    return;
                }
                Array.prototype.slice.call(chatBody.querySelectorAll(".msg-row")).forEach(function(row) {
                    var bubble = row.querySelector(".bubble");
                    if (!bubble) {
                        return;
                    }
                    var role = row.classList.contains("incoming") ? "assistant" : "user";
                    ensureBubbleMeta(row, bubble, role, bubble.textContent.trim());
                });
            }

            function splitAssistantLines(raw) {
                var cleaned = String(raw || "").replace(/\r/g, "").trim();
                if (!cleaned) {
                    return [];
                }

                var parts = cleaned
                    .split(/\n{1,}/)
                    .map(function(line) {
                        return line
                            .replace(/^[-*•]\s*/, "")
                            .replace(/^\d+[\.、)\-]\s*/, "")
                            .trim();
                    })
                    .filter(Boolean);

                if (parts.length <= 1) {
                    return [cleaned];
                }
                return parts.slice(0, 8);
            }

            function normalizeBaseUrl(url) {
                var result = String(url || "").trim().replace(/\/+$/, "");
                result = result.replace(/\/chat\/completions$/i, "");
                result = result.replace(/\/completions$/i, "");
                return result;
            }

            function getActivePreset() {
                var presets = readJSON(PRESET_KEY) || [];
                var activeId = localStorage.getItem(ACTIVE_PRESET_KEY);
                if (!activeId) {
                    return null;
                }
                for (var i = 0; i < presets.length; i += 1) {
                    if (presets[i].id === activeId) {
                        return presets[i];
                    }
                }
                return null;
            }

            function fetchWithTimeout(url, options, timeoutMs, requestState) {
                var controller = requestState && requestState.controller ? requestState.controller : new AbortController();
                if (requestState) {
                    requestState.controller = controller;
                }
                var timer = window.setTimeout(function() {
                    controller.abort();
                }, timeoutMs || 30000);

                var merged = Object.assign({}, options, { signal: controller.signal });
                return fetch(url, merged)
                    .finally(function() {
                        window.clearTimeout(timer);
                    })
                    .catch(function(err) {
                        if (err && err.name === "AbortError") {
                            if (requestState && activeReplyRequest !== requestState) {
                                var manualAbortError = new Error("已手动中断");
                                manualAbortError.isManualAbort = true;
                                throw manualAbortError;
                            }
                            throw new Error("请求超时");
                        }
                        throw err;
                    });
            }

            function callChatApi(preset, messages, requestState) {
                var base = normalizeBaseUrl(preset.baseUrl);
                var endpointCandidates = [
                    base + "/chat/completions",
                    base + "/v1/chat/completions"
                ];
                var idx = 0;

                function tryNext(lastErr) {
                    if (idx >= endpointCandidates.length) {
                        return Promise.reject(lastErr || new Error("无法访问聊天接口"));
                    }

                    var url = endpointCandidates[idx++];
                    return fetchWithTimeout(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + preset.apiKey
                        },
                        body: JSON.stringify({
                            model: preset.model,
                            messages: messages,
                            temperature: 0.8
                        })
                    }, 45000, requestState)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error("HTTP " + response.status + " @ " + url);
                        }
                        return response.json();
                    })
                    .catch(function(err) {
                        if (err && err.isManualAbort) {
                            return Promise.reject(err);
                        }
                        return tryNext(err);
                    });
                }

                return tryNext();
            }

            function parseAssistantContent(data) {
                if (!data) {
                    return "";
                }

                if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                    return data.choices[0].message.content;
                }
                if (typeof data.reply === "string") {
                    return data.reply;
                }
                if (typeof data.message === "string") {
                    return data.message;
                }
                if (typeof data.output === "string") {
                    return data.output;
                }
                if (Array.isArray(data.output_text)) {
                    return data.output_text.join("\n");
                }

                return "";
            }

            function buildSystemPrompt() {
                var settings = getScopedChatSettings(chatState.chatId) || readJSON(STORAGE_KEY);
                if (window.PinkPromptConfig && typeof window.PinkPromptConfig.buildSystemPrompt === "function") {
                    return window.PinkPromptConfig.buildSystemPrompt(settings, chatState);
                }

                return [
                    "你正在扮演聊天对象。",
                    "对象昵称：" + (chatState.title || "对方"),
                    "回复格式：每次 2-6 条短消息，换行分隔，不编号。"
                ].join("\n");
            }

            function appendTyping() {
                if (!chatBody) {
                    return null;
                }
                var el = document.createElement("div");
                el.className = "typing";
                el.textContent = "对方正在输入...";
                chatBody.appendChild(el);
                chatBody.scrollTop = chatBody.scrollHeight;
                return el;
            }

            function removeTyping(el) {
                if (el && el.parentNode) {
                    el.parentNode.removeChild(el);
                }
            }

            function autoSizeInput() {
                if (!chatInput) {
                    return;
                }
                chatInput.style.height = "auto";
                chatInput.style.height = Math.min(chatInput.scrollHeight, 76) + "px";
            }

            function sendMessages() {
                if (activeReplyRequest) {
                    abortActiveReply();
                    return;
                }

                var preset = getActivePreset();
                if (!preset || !preset.baseUrl || !preset.apiKey || !preset.model) {
                    showToast("请先在 API 配置里启用可用预设");
                    return;
                }

                var rawInput = (chatInput.value || "").trim();

                if (rawInput) {
                    addMessageRow("user", rawInput);
                    chatState.history.push({ role: "user", content: rawInput, time: formatMessageTime() });
                    chatState.history = trimHistory(chatState.history);
                    chatState.pendingUserCount += 1;
                    saveHistory();
                    chatInput.value = "";
                    autoSizeInput();
                    return;
                }

                if (!chatState.pendingUserCount) {
                    return;
                }

                requestAssistantReply(chatState.history);
            }

            applyHeaderAndStyle();

            window.addEventListener("storage", refreshChatAppearanceFromStorage);

            CHAT_HISTORY_MAX = readRetainCount();

            var restoredHistory = loadHistory();
            if (restoredHistory && restoredHistory.length) {
                chatState.history = trimHistory(restoredHistory);
                renderHistoryFromStorage(chatState.history);
            } else {
                chatState.history = trimHistory(collectVisibleHistory());
                saveHistory();
            }
            chatState.pendingUserCount = computePendingUserCount(chatState.history);

            if (chatInput) {
                chatInput.addEventListener("input", autoSizeInput);
                // 回车发送消息（Shift+Enter 换行）
                chatInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessages();
    }
});
                autoSizeInput();
            }
            if (attachmentToggle) {
                attachmentToggle.addEventListener("click", function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    toggleAttachmentPanel();
                });
            }
            if (sendBtn) {
                sendBtn.addEventListener("click", sendMessages);
            }

            attachmentItems.forEach(function(item) {
                item.addEventListener("click", function() {
                    var toolName = item.getAttribute("data-tool-name") || "该功能";
                    showToast(toolName + " 功能入口已展开");
                    closeAttachmentPanel();
                });
            });

            if (editSaveBtn) {
                editSaveBtn.addEventListener("click", saveBubbleEdit);
            }
            if (editCancelBtn) {
                editCancelBtn.addEventListener("click", closeEditModal);
            }
            if (editUndoBtn) {
                editUndoBtn.addEventListener("click", undoBubbleEdit);
            }
            if (memoryLink) {
                memoryLink.addEventListener("click", function() {
                    openMemoryModal();
                });
            }
            if (memoryClose) {
                memoryClose.addEventListener("click", closeMemoryModal);
            }
            if (memoryRefresh) {
                memoryRefresh.addEventListener("click", function() {
                    scheduleMemorySummary({ force: true, silent: false });
                });
            }
            if (bubbleEditAction) {
                bubbleEditAction.addEventListener("click", function() {
                    if (chatState.actionBubble) {
                        openEditModal(chatState.actionBubble);
                    }
                });
            }
            if (bubbleUndoAction) {
                bubbleUndoAction.addEventListener("click", deleteBubbleFromMenu);
            }
            if (editModal) {
                editModal.addEventListener("click", function(event) {
                    if (event.target === editModal) {
                        closeEditModal();
                    }
                });
            }
            if (memoryModal) {
                memoryModal.addEventListener("click", function(event) {
                    if (event.target === memoryModal) {
                        closeMemoryModal();
                    }
                });
            }
            document.addEventListener("click", function(event) {
                if (isAssistantAvatar(event.target)) {
                    event.preventDefault();
                    event.stopPropagation();
                    regenerateAssistantRoundFromAvatar(event.target.closest(".msg-avatar"));
                    return;
                }
                if (attachmentPanel && attachmentPanel.classList.contains("show")) {
                    var clickedToggle = attachmentToggle && attachmentToggle.contains(event.target);
                    var clickedPanel = attachmentPanel.contains(event.target);
                    if (!clickedToggle && !clickedPanel) {
                        closeAttachmentPanel();
                    }
                }
                if (!bubbleActionMenu || !bubbleActionMenu.classList.contains("show")) {
                    return;
                }
                if (bubbleActionMenu.contains(event.target)) {
                    return;
                }
                var bubble = event.target && event.target.closest ? event.target.closest(".bubble") : null;
                if (bubble) {
                    return;
                }
                closeBubbleActionMenu();
            });
            document.addEventListener("keydown", function(event) {
                if (event.key === "Escape" && attachmentPanel && attachmentPanel.classList.contains("show")) {
                    closeAttachmentPanel();
                }
                if (event.key === "Escape" && editModal && editModal.classList.contains("show")) {
                    closeEditModal();
                }
                if (event.key === "Escape" && memoryModal && memoryModal.classList.contains("show")) {
                    closeMemoryModal();
                }
                if (event.key === "Escape" && bubbleActionMenu && bubbleActionMenu.classList.contains("show")) {
                    closeBubbleActionMenu();
                }
                if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z" && editModal && editModal.classList.contains("show")) {
                    event.preventDefault();
                    undoBubbleEdit();
                }
            });

            if (editTextarea) {
                editTextarea.addEventListener("keydown", function(event) {
                    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                        event.preventDefault();
                        saveBubbleEdit();
                    }
                });
            }
            
            initExistingBubbles();
            bindBubbleEditor();
            setLayerHiddenState(editModal, true);
            setLayerHiddenState(memoryModal, true);
            syncAttachmentPanelHeight();
            window.addEventListener("resize", syncAttachmentPanelHeight);

            (function() {
                function buildMessagesTarget() {
                    var target = 'wechat.html?tab=messages';
                    if (chatState.chatId && chatState.chatId !== 'default') {
                        target += '&chatId=' + encodeURIComponent(chatState.chatId);
                    } else if (chatState.contactId) {
                        target += '&contactId=' + encodeURIComponent(chatState.contactId);
                    }
                    return target;
                }

                function buildDetailTarget() {
                    var params = new URLSearchParams();
                    if (chatState.chatId) {
                        params.set('chatId', chatState.chatId);
                    }
                    if (chatState.contactId) {
                        params.set('contactId', chatState.contactId);
                    }
                    var query = params.toString();
                    return 'chat-settings.html' + (query ? '?' + query : '');
                }

                try {
                    var backLink = document.querySelector('.back-link');
                    if (backLink) {
                        backLink.setAttribute('href', buildMessagesTarget());
                        backLink.addEventListener('click', function(e) {
                            e.preventDefault();
                            document.body.classList.add('page-leaving');
                            window.setTimeout(function () {
                                window.location.href = backLink.href;
                            }, 180);
                        });
                    }

                    var dl = document.querySelector('.detail-link');
                    if (dl) {
                        dl.setAttribute('href', buildDetailTarget());
                    }
                } catch (err) {
                    console.warn('navigation link setup failed', err);
                }
            })();
        })();
        
    </script>
</body>
</html>
